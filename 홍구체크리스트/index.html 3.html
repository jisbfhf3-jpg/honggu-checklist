<style>
  @font-face {
    font-family: 'YeogiOttaeJalnan';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_four@1.2/JalnanOTF00.woff') format('woff');
    font-weight: normal;
    font-display: swap;
  }
  .more-tab, .more-tab *{font-family:'YeogiOttaeJalnan', -apple-system, BlinkMacSystemFont, sans-serif;}
  .more-tab .panel h3{font-size:18px;}
  .more-tab .more-row{font-size:16px;padding:15px 2px;}
  .more-tab .more-row button{font-size:14px;padding:8px 15px;}
  .more-tab .empty-note{font-size:15px;line-height:1.5;}
  .more-tab .footer-note{font-size:14px;line-height:1.6;}
  :root{
    --bg:#F2F4F6; --card:#FFFFFF; --border:#EEF0F3;
    --text:#191F28; --text-sub:#6B7684; --text-faint:#8B95A1;
    --blue:#3182F6; --blue-dark:#1B64DA; --blue-50:#EFF5FF; --blue-100:#DCE9FE; --blue-300:#8BB8FE;
    --red:#F04452; --amber:#B25E09; --amber-bg:#FFF7E6; --amber-border:#F5E3BB; --amber-strong:#D48806;
    --radius:20px;
    --shadow-card:0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'YeogiOttaeJalnan',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; padding-bottom:90px;
  }
  /* 잘난체는 두꺼운 인상이라 제목류는 크기/굵기를 낮춰서 과하지 않게 조정 */
  .panel h3{font-size:13px;font-weight:500;}
  .overall-title{font-size:12.5px;font-weight:500;}
  .overall-pct{font-size:20px;font-weight:600;}
  .notice-title{font-size:13.5px;font-weight:600;}
  .notice-card-head b{font-size:12.5px;font-weight:500;}
  .checkin-title{font-size:23px;font-weight:600;}
  .rc-daybox-num{font-size:16px;font-weight:600;}
  .rc-name{font-size:12.5px;font-weight:500;}
  .day-banner .d{font-size:13.5px;font-weight:500;}
  .cal-nav .label{font-size:12.5px;font-weight:500;}
  .sched-nav .label{font-size:12px;font-weight:500;}
  .section-head .name{font-size:13px;font-weight:500;}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px;}

  .header-right{display:flex;align-items:center;gap:8px;}
  .mini-clock{font-family:'SF Mono','Consolas','Menlo',monospace;font-size:10.5px;font-weight:700;color:var(--text-sub);letter-spacing:0;background:var(--card);box-shadow:var(--shadow-card);padding:7px 9px;border-radius:10px;white-space:nowrap;}

  .app-header{padding:22px 16px 14px;max-width:480px;margin:0 auto;}
  .header-top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .app-header .store{display:none;}
  .store-btn{display:flex;align-items:center;gap:5px;border:none;background:none;padding:0;cursor:pointer;min-width:0;font-family:inherit;}
  .store-btn-name{font-size:19px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .store-btn-chev{font-size:15px;color:var(--text-sub);line-height:1;margin-top:-4px;}
  .store-sheet-overlay{position:fixed;inset:0;background:rgba(15,20,30,.5);display:none;align-items:flex-start;justify-content:center;z-index:9800;padding:0;}
  .store-sheet-overlay.show{display:flex;}
  .store-sheet{background:#fff;width:100%;max-width:480px;min-height:100%;padding:20px 18px 30px;position:relative;}
  .store-sheet-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border:none;background:none;font-size:19px;color:var(--text);cursor:pointer;}
  .store-sheet-head{display:flex;align-items:center;gap:14px;margin:44px 0 22px;}
  .store-sheet-logo{width:56px;height:56px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:26px;flex:0 0 auto;}
  .store-sheet-title{font-size:21px;font-weight:700;color:var(--text);}
  .store-sheet-sub{font-size:13px;color:var(--text-faint);margin-top:3px;}
  .store-sheet-card{background:var(--bg);border-radius:16px;padding:16px;}
  .store-sheet-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .store-sheet-label{font-size:13px;color:var(--text-sub);}
  .store-sheet-row b{font-size:15px;color:var(--text);}
  .store-sheet-btn{width:100%;border:none;background:var(--blue);color:#fff;font-size:14px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer;font-family:inherit;}
  .notice-bell-btn{position:relative;flex:0 0 auto;width:36px;height:36px;border-radius:11px;border:none;background:var(--card);box-shadow:var(--shadow-card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .notice-bell-btn svg{width:19px;height:19px;}
  .notice-bell-btn:active{background:var(--blue-50);color:var(--blue-dark);}
  .notice-bell-badge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--bg);}

  .tabs{display:flex;gap:6px;padding:4px;background:#E8ECF1;border-radius:16px;margin-top:14px;}
  .tab-btn{flex:1;border:none;background:transparent;padding:10px 4px;border-radius:13px;font-size:14px;font-weight:700;color:var(--text-sub);cursor:pointer;transition:background .15s, color .15s;}
  .tab-btn.active{background:var(--card);color:var(--blue-dark);box-shadow:0 1px 3px rgba(20,30,60,.10);}

  .panel{margin-top:14px;background:var(--card);border-radius:var(--radius);border:none;box-shadow:var(--shadow-card);padding:18px 18px 20px;}
  .panel h3{font-size:14.5px;margin:0 0 10px;font-weight:800;display:flex;align-items:center;gap:6px;}
  .panel.manager{background:var(--amber-bg);box-shadow:none;border:1px solid var(--amber-border);}
  .panel.manager h3{color:var(--amber);}

  .overall{margin-top:14px;background:var(--card);border-radius:var(--radius);padding:20px 20px;border:none;box-shadow:var(--shadow-card);}
  .overall-row{display:flex;justify-content:space-between;align-items:baseline;}
  .overall-title{font-size:14px;font-weight:700;}
  .overall-pct{font-size:24px;font-weight:800;color:var(--blue);letter-spacing:-.02em;}
  .bar-track{height:8px;border-radius:6px;background:#EEF1F6;margin-top:12px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--blue-300),var(--blue));border-radius:6px;transition:width .25s;}
  .overall-sub{font-size:12px;color:var(--text-faint);margin-top:8px;}

  .cal-card{margin-top:14px;background:var(--card);border-radius:var(--radius);border:none;box-shadow:var(--shadow-card);padding:18px 14px 20px;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .cal-nav button{border:none;background:#F1F3F8;width:32px;height:32px;border-radius:11px;font-size:15px;color:var(--text-sub);cursor:pointer;}
  .cal-nav .label{font-size:14px;font-weight:700;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;}
  .cal-dow{font-size:11px;color:var(--text-faint);padding-bottom:4px;font-weight:600;}
  .cal-cell{position:relative;aspect-ratio:1/1;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:600;color:var(--text-sub);background:#F4F6F9;cursor:pointer;border:1.5px solid transparent;}
  .cal-cell.empty{visibility:hidden;cursor:default;}
  .cal-cell .cal-pct{font-size:9.5px;font-weight:700;color:var(--text-faint);}
  .cal-cell.done100 .cal-pct{color:var(--blue-dark);}
  .cal-cell.today{border-color:var(--text);}
  @keyframes calSelPop{ 0%{transform:scale(.68);} 55%{transform:scale(1.16);} 100%{transform:scale(1);} }
  .cal-cell.selected{
    outline:3px solid var(--blue-dark); outline-offset:2px;
    box-shadow:0 0 0 5px rgba(30,79,190,.18);
    position:relative; z-index:2;
    animation:calSelPop .3s cubic-bezier(.34,1.56,.64,1);
  }


  .day-banner{margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 2px;}
  .day-banner .d{font-size:15px;font-weight:700;}
  .day-banner .btns{display:flex;gap:14px;flex:0 0 auto;}
  .day-banner .link-btn{border:none;background:none;color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
  .day-banner .link-btn.on{color:var(--red);}

  .memo-box{width:100%;min-height:64px;border:1.4px solid var(--border);border-radius:10px;padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical;background:#FBFCFE;}
  .memo-box:focus{outline:none;border-color:var(--blue);}

  .add-form{display:flex;gap:8px;}
  .add-form input[type=text]{flex:1;font-size:13px;padding:8px 10px;border:1.4px solid var(--border);border-radius:8px;font-family:inherit;background:#FBFCFE;}
  .add-form input[type=text]:focus{outline:none;border-color:var(--blue);}
  .add-form button{flex:0 0 auto;padding:9px 16px;border-radius:14px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}

  .list-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:9px 0;border-top:1px solid #F0F2F6;}
  .list-row:first-child{border-top:none;}
  .list-row .body{flex:1;min-width:0;}
  .list-row .txt{font-size:13px;line-height:1.4;word-break:break-word;}
  .list-row .meta{font-size:11px;color:var(--text-faint);margin-top:3px;}
  .list-row .del{flex:0 0 auto;border:none;background:#F1F3F8;color:var(--text-sub);width:24px;height:24px;border-radius:10px;font-size:13px;cursor:pointer;}

  .att-btns{display:flex;gap:10px;}
  .att-btn{flex:1;padding:15px;border-radius:16px;border:none;font-weight:800;font-size:14.5px;cursor:pointer;}
  .att-btn.in{background:var(--blue-50);color:var(--blue-dark);}
  .att-btn:disabled{opacity:.45;cursor:not-allowed;}
  .geo-status-row{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:11.5px;color:var(--text-sub);font-weight:600;line-height:1.4;}
  .geo-status-text{flex:1;display:flex;align-items:center;gap:6px;}
  .geo-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--text-faint);}
  .geo-dot.checking{background:#E0A63A;animation:geoPulse 1s infinite;}
  .geo-dot.ok{background:#3FAE5C;}
  .geo-dot.far{background:var(--red);}
  @keyframes geoPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .geo-retry-btn{flex:0 0 auto;width:26px;height:26px;border-radius:9px;border:none;background:var(--card);box-shadow:var(--shadow-card);font-size:12px;cursor:pointer;}
  .att-btn.out{background:#FFF1EC;color:#C0392B;}
  .att-log{margin-top:12px;}
  .att-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-top:1px solid #F0F2F6;font-size:12.5px;}
  .att-row:first-child{border-top:none;}
  .badge{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;margin-left:6px;}
  .badge.ontime{background:var(--blue-50);color:var(--blue-dark);}
  .badge.late{background:#FFF1EC;color:#C0392B;}
  .badge.early{background:#FFF1EC;color:#C0392B;}
  .att-dashboard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:13px;}
  .att-dashboard-title{font-size:17px;font-weight:800;color:var(--text);}
  .att-dashboard-date{font-size:11.5px;color:var(--text-faint);margin-top:4px;}
  .att-today-btn{border:none;background:var(--blue-50);color:var(--blue-dark);font-family:inherit;font-size:11.5px;font-weight:800;min-height:34px;padding:7px 11px;border-radius:11px;cursor:pointer;}
  .att-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .att-summary-card{background:#F7F9FC;border:1px solid var(--border);border-radius:13px;padding:11px 8px;text-align:center;min-width:0;}
  .att-summary-card b{display:block;font-size:21px;color:var(--text);line-height:1.1;}
  .att-summary-card span{display:block;font-size:10.5px;color:var(--text-faint);font-weight:700;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .att-summary-card.late b,.att-summary-card.missing b{color:var(--red);}
  .att-summary-card.done b{color:var(--blue-dark);}
  .att-schedule-note{margin-top:10px;font-size:10.5px;line-height:1.5;color:var(--text-faint);background:#F7F9FC;border-radius:10px;padding:8px 10px;}
  .att-people-list{display:flex;flex-direction:column;gap:9px;}
  .att-person-card{width:100%;border:1px solid var(--border);background:#fff;border-radius:15px;padding:12px 13px;font-family:inherit;text-align:left;display:flex;align-items:center;gap:11px;cursor:pointer;}
  .att-person-card:active{background:#F8FAFD;}
  .att-person-dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:#AAB2BC;box-shadow:0 0 0 4px #F1F3F6;}
  .att-person-card.normal .att-person-dot{background:#2FA85A;box-shadow:0 0 0 4px #E8F7EC;}
  .att-person-card.late .att-person-dot,.att-person-card.early .att-person-dot{background:#F04452;box-shadow:0 0 0 4px #FDEBEC;}
  .att-person-card.done .att-person-dot{background:var(--blue);box-shadow:0 0 0 4px var(--blue-50);}
  .att-person-card.missing .att-person-dot{background:#F04452;box-shadow:0 0 0 4px #FDEBEC;}
  .att-person-main{flex:1;min-width:0;}

  .att-detail-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0;}

  .sched-sub{font-size:10.5px;color:var(--text-faint);margin-top:3px;padding-left:12px;}

  .sched-add{display:flex;gap:5px;margin-top:2px;}

  .sched-add button{flex:0 0 auto;font-size:11px;padding:6px 10px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;}

  .section{margin-top:12px;background:var(--card);border-radius:var(--radius);border:none;box-shadow:var(--shadow-card);overflow:hidden;}

  .cam-btn{border:1px solid var(--border);background:#F9FAFB;color:#8B95A1;width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 28px;}

  .section-photo-summary{padding:0 14px 11px;}

  .section-photo-drawer{margin:0 14px 12px;padding:12px;background:#F7F9FC;border:1px solid var(--border);border-radius:14px;}
  .section-photo-drawer-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:11.5px;color:var(--text-sub);font-weight:700;}
  .section-photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}

  .section-photo-grid .ph-thumb .ph-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.62);color:#fff;border:none;font-size:13px;line-height:22px;text-align:center;cursor:pointer;padding:0;}

  .chev{width:9px;height:9px;border-right:2px solid var(--text-faint);border-bottom:2px solid var(--text-faint);transform:rotate(-45deg);transition:transform .15s;}

  .mini-bar{width:44px;height:5px;border-radius:4px;background:#EEF1F6;overflow:hidden;}
  .mini-bar i{display:block;height:100%;background:var(--blue);}
  .cap-row{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap;}

  .items{max-height:0;overflow:hidden;transition:max-height .25s ease;}

  .item-row{display:flex;align-items:flex-start;gap:11px;padding:10px 16px;border-top:1px solid #F0F2F6;}
  .item-row .box{width:20px;height:20px;flex:0 0 20px;border-radius:7px;border:1.6px solid #CBD3E1;margin-top:1px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff;}

  .item-row .box svg{width:12px;height:12px;display:none;}
  .item-row .box.checked svg{display:block;}
  .item-row .txt{font-size:13.5px;line-height:1.45;cursor:pointer;padding-top:1px;}
  .item-row .txt.checked{color:var(--text-faint);text-decoration:line-through;}
  .item-meta{font-size:10.5px;color:var(--text-faint);margin-top:3px;}
  .manual-link{font-size:11px;color:var(--blue);text-decoration:none;font-weight:600;white-space:nowrap;border:none;background:none;cursor:pointer;padding:0;font-family:inherit;}
  .manual-btn{flex:0 0 26px;width:26px;height:26px;border-radius:9px;border:none;background:var(--blue-50);color:var(--blue-dark);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(15,20,30,.72);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:#fff;border-radius:22px;padding:18px 16px 16px;max-width:480px;width:100%;max-height:88vh;overflow:auto;position:relative;}
  .modal-close{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:11px;border:none;background:#F1F3F8;color:var(--text-sub);font-size:16px;cursor:pointer;z-index:2;}
  .modal-openlink{display:block;text-align:center;font-size:12px;color:var(--text-sub);margin-top:10px;}
  .modal-box.small{max-width:320px;padding:22px 20px 18px;text-align:center;}
  .dialog-msg{font-size:14px;color:var(--text);line-height:1.5;margin-bottom:16px;font-weight:600;white-space:pre-line;}
  .dialog-input{width:100%;padding:10px 12px;border:1.4px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;margin-bottom:14px;box-sizing:border-box;}
  .dialog-input:focus{outline:none;border-color:var(--blue);}
  .dialog-btns{display:flex;gap:8px;}
  .dialog-btn{flex:1;padding:12px;border-radius:14px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .dialog-btn.ghost{background:#F1F3F8;color:var(--text-sub);}
  .dialog-btn.primary{background:var(--blue);color:#fff;}
  .dialog-btn.danger{background:var(--red);color:#fff;}

  .item-row.numtype{align-items:center;}
  .num-input{width:60px;padding:6px 8px;border:1.4px solid var(--border);border-radius:10px;font-size:13px;text-align:right;font-family:inherit;}
  .num-input:focus{outline:none;border-color:var(--blue);}
  .num-input.low{border-color:var(--red);background:#FFF3F1;color:var(--red);font-weight:700;}
  .num-unit{font-size:12px;color:var(--text-faint);min-width:24px;}

  .edit-item-block{padding:10px 16px;border-top:1px solid #F0F2F6;display:flex;flex-direction:column;gap:6px;}

  .edit-input{flex:1;font-size:13.5px;padding:7px 10px;border:1.4px solid var(--border);border-radius:10px;font-family:inherit;color:var(--text);background:#FBFCFE;}
  .edit-input:focus{outline:none;border-color:var(--blue);}
  .type-select{font-size:12.5px;padding:6px 8px;border:1.4px solid var(--border);border-radius:10px;background:#FBFCFE;font-family:inherit;}
  .thresh-input{width:52px;padding:6px 8px;border:1.4px solid var(--border);border-radius:10px;font-size:12.5px;}
  .unit-input{width:48px;padding:6px 8px;border:1.4px solid var(--border);border-radius:10px;font-size:12.5px;}
  .url-input{width:100%;padding:7px 10px;border:1.4px solid var(--border);border-radius:10px;font-size:12.5px;font-family:inherit;background:#FBFCFE;}
  .mini-label{font-size:11px;color:var(--text-faint);}
  .del-btn{flex:0 0 26px;height:26px;border-radius:9px;border:none;background:#FBEAE8;color:var(--red);font-size:16px;line-height:1;cursor:pointer;}
  .move-btns{display:flex;flex-direction:column;gap:2px;flex:0 0 22px;}

  .move-btns button:active{background:var(--blue-100);color:var(--blue-dark);}
  .rc-desc{font-size:12px;color:var(--text-faint);line-height:1.5;margin:2px 0 14px;}
  .rc-list{display:flex;flex-direction:column;gap:12px;}
  .rc-row{background:var(--bg);border-radius:16px;padding:14px 14px 16px;}
  .rc-row.edit{background:transparent;padding:8px 0;display:flex;align-items:center;gap:6px;border-top:1px solid #F0F2F6;}
  .rc-row-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .rc-info{flex:1;min-width:0;}
  .rc-name{font-size:13.5px;font-weight:700;color:var(--text);}
  .rc-sub{font-size:11px;color:var(--text-faint);margin-top:3px;}
  .rc-daybox{flex:0 0 auto;width:66px;height:56px;border-radius:14px;background:var(--blue-50);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}

  .rc-daybox.none{background:#F1F3F6;}
  .rc-daybox.none .rc-daybox-num, .rc-daybox.none .rc-daybox-label{color:var(--text-faint);}
  .rc-dots{display:flex;gap:3px;margin:12px 0 12px;}

  .rc-done-btn:active{background:var(--blue-dark);}

  .add-item-row{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid #F0F2F6;}
  .add-item-row input{flex:1;font-size:13.5px;padding:7px 10px;border:1.4px dashed var(--border);border-radius:10px;font-family:inherit;background:#FBFCFE;}
  .add-item-row input:focus{outline:none;border-color:var(--blue);border-style:solid;}
  .add-item-row button{flex:0 0 auto;padding:7px 16px;border-radius:14px;border:none;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}

  .footer-note{text-align:center;font-size:11.5px;color:var(--text-faint);margin-top:22px;line-height:1.6;padding:0 20px;}
  .reset-btn{display:block;margin:14px auto 0;border:none;background:none;color:#C0392B;font-size:12.5px;cursor:pointer;}
  .loading{text-align:center;padding:40px 0;color:var(--text-faint);font-size:13px;}
  .toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(16px);background:#191F28;color:#fff;padding:12px 20px;border-radius:14px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:10000;max-width:86vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:#F04452;}

  .checkin-overlay{position:fixed;inset:0;background:linear-gradient(160deg,var(--blue-dark),var(--blue) 65%);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10500;padding:32px;text-align:center;color:#fff;}
  .checkin-overlay.out{background:linear-gradient(160deg,#1F7A3D,#3FAE5C 65%);}
  .checkin-overlay.out .checkin-cta{color:#1F7A3D;}
  .checkin-overlay.late{background:linear-gradient(160deg,#A82F22,#F0653D 65%);}
  .checkin-overlay.late .checkin-cta{color:#A82F22;}
  .checkin-overlay.show{display:flex;}
  .checkin-badge{width:86px;height:86px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:checkinPop .45s cubic-bezier(.34,1.56,.64,1);}
  .checkin-badge svg{width:42px;height:42px;}

  .checkin-title{font-size:27px;font-weight:800;margin-bottom:10px;letter-spacing:-.01em;}
  .checkin-sub{font-size:14px;opacity:.85;font-weight:700;margin-bottom:28px;}
  .checkin-tagline{font-size:15.5px;font-weight:700;line-height:1.55;margin-bottom:44px;opacity:.95;max-width:280px;}
  .checkin-cta{background:#fff;color:var(--blue-dark);border:none;padding:16px 28px;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;width:100%;max-width:320px;box-shadow:0 8px 20px rgba(0,0,0,.18);}

  /* ---- 연속촬영 CTA ---- */
  .burst-cta-wrap{margin-top:14px;display:flex;flex-direction:column;gap:8px;}
  .burst-cta-btn{width:100%;background:var(--blue);color:#fff;border:none;padding:15px;border-radius:16px;font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
  .burst-cta-btn span{font-weight:900;opacity:.9;}
  .burst-cta-secondary{width:100%;background:var(--card);color:var(--text-sub);border:1px solid var(--border);padding:12px;border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;}

  /* ---- 연속촬영 전체화면 ---- */
  .burst-overlay{position:fixed;inset:0;background:#0B0D10;display:none;flex-direction:column;z-index:10800;color:#fff;}
  .burst-overlay.show{display:flex;}
  .burst-top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px calc(6px + env(safe-area-inset-top));}
  .burst-icon-btn{width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:15px;cursor:pointer;}
  .burst-icon-btn.on{background:#F0A23A;color:#191F28;}
  .burst-icon-btn.dark{background:#F1F3F8;color:var(--text);}
  .burst-progress{font-size:14px;font-weight:800;background:rgba(255,255,255,.14);padding:6px 14px;border-radius:999px;}
  .burst-item-label{text-align:center;font-size:15.5px;font-weight:800;padding:2px 20px 12px;}
  .burst-video-wrap{position:relative;flex:1;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .burst-video-wrap video, .burst-preview-img{width:100%;height:100%;object-fit:cover;display:block;}
  .burst-captured{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);background:#1F7A3D;color:#fff;font-size:13px;font-weight:800;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s, transform .2s;pointer-events:none;}
  .burst-captured.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .burst-thumbstrip{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;padding:12px 16px 0;}
  .burst-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);}
  .burst-dot.done{background:#3FAE5C;}
  .burst-dot.active{outline:2px solid #fff;outline-offset:2px;}
  .burst-controls{display:flex;align-items:center;justify-content:space-between;padding:16px 22px 6px;}
  .burst-nav-btn{background:none;border:none;color:#fff;font-size:13.5px;font-weight:700;opacity:.85;cursor:pointer;padding:10px;}
  .burst-nav-btn:disabled{opacity:.3;}

function pad2(n){ return String(n).padStart(2,'0'); }
function ymKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1); }
function dKey(d){ return pad2(d.getDate()); }
function isSameDay(a,b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function genId(){ return 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nowHM(){ const d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function fullTimeLabel(){ const d=new Date(); return pad2(d.getMonth()+1)+'/'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
function stationTotal(stationMeta){

}
function sectionCheckItems(sec){ return (state.structure[sec.id]||[]).filter(it=>it.type!=='number'); }
function sectionNumberItems(sec){ return (state.structure[sec.id]||[]).filter(it=>it.type==='number'); }
function stationCheckTotal(stationMeta){

}
function stationInventoryTotal(stationMeta){

}
function doneCheckCount(rec, stationMeta){

}

/* ---------------- 매뉴얼 사진/영상 모달 ---------------- */
function detectMediaType(url){
  const u = url.toLowerCase();
  if(u.startsWith('data:image')) return 'image';
  if(/\.(jpg|jpeg|png|gif|webp|bmp)(\?|$)/.test(u)) return 'image';
  if(/\.(mp4|webm|mov|m4v)(\?|$)/.test(u)) return 'video';
  if(/youtube\.com\/watch|youtu\.be\/|youtube\.com\/shorts\//.test(u)) return 'youtube';
  if(/drive\.google\.com\/file\/d\//.test(u)) return 'gdrive';
  return 'link';
}
function youtubeEmbedUrl(url){
  let id = '';
  const m1 = url.match(/[?&]v=([^&]+)/);
  const m2 = url.match(/youtu\.be\/([^?&]+)/);
  const m3 = url.match(/youtube\.com\/shorts\/([^?&]+)/);
  if(m1) id = m1[1]; else if(m2) id = m2[1]; else if(m3) id = m3[1];
  return id ? `https://www.youtube.com/embed/${id}` : null;
}
function gdriveEmbedUrl(url){
  const m = url.match(/\/file\/d\/([^/]+)/);
  return m ? `https://drive.google.com/file/d/${m[1]}/preview` : null;
}
function openLinkLine(url){
  return `<a class="modal-openlink" href="${escapeHtml(url)}" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>`;
}
function openManual(url){
  url = (url||'').trim();
  if(!url) return;
  const type = detectMediaType(url);
  let inner = '';
  if(type==='image'){
    inner = `<img src="${escapeHtml(url)}" alt="매뉴얼 이미지" style="max-width:100%;max-height:70vh;border-radius:10px;display:block;margin:0 auto;">${openLinkLine(url)}`;
  } else if(type==='video'){
    inner = `<video src="${escapeHtml(url)}" controls style="max-width:100%;max-height:70vh;border-radius:10px;display:block;margin:0 auto;"></video>${openLinkLine(url)}`;
  } else if(type==='youtube'){
    const embed = youtubeEmbedUrl(url);
    inner = embed
      ? `<iframe src="${embed}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;" allow="autoplay; encrypted-media" allowfullscreen></iframe>${openLinkLine(url)}`
      : `<div style="padding:30px 10px;text-align:center;font-size:13px;color:var(--text-sub);">유튜브 링크를 확인할 수 없어요.</div>${openLinkLine(url)}`;
  } else if(type==='gdrive'){
    const embed = gdriveEmbedUrl(url);
    inner = embed
      ? `<iframe src="${embed}" style="width:100%;aspect-ratio:16/9;border:0;border-radius:10px;" allow="autoplay" allowfullscreen></iframe>${openLinkLine(url)}`
      : `<div style="padding:30px 10px;text-align:center;font-size:13px;color:var(--text-sub);">드라이브 링크를 확인할 수 없어요.</div>${openLinkLine(url)}`;
  } else {
    inner = `<div style="padding:30px 10px;text-align:center;">
      <div style="font-size:13px;color:var(--text-sub);margin-bottom:14px;">이 링크는 바로 미리보기가 안 돼요.</div>
      <a href="${escapeHtml(url)}" target="_blank" rel="noopener" style="display:inline-block;padding:10px 18px;background:var(--blue);color:#fff;border-radius:8px;font-weight:700;font-size:13px;text-decoration:none;">새 탭에서 열기</a>
    </div>`;
  }
  document.getElementById('manualModalContent').innerHTML = inner;
  document.getElementById('manualModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeManual(){
  document.getElementById('manualModal').classList.remove('show');
  document.getElementById('manualModalContent').innerHTML = '';
  document.body.style.overflow = '';
}

/* ---------------- 커스텀 확인/입력 대화상자 (샌드박스에서 confirm/prompt가 막힐 수 있어 대체) ---------------- */
function confirmDialog(message){
  return new Promise(resolve=>{
    const modal = document.getElementById('confirmModal');
    document.getElementById('confirmMessage').textContent = message;
    modal.classList.add('show');
    const okBtn = document.getElementById('confirmOkBtn');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    const finish = (result) => {
      modal.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      modal.removeEventListener('click', onBackdrop);
      resolve(result);
    };
    const onOk = () => finish(true);
    const onCancel = () => finish(false);
    const onBackdrop = (e) => { if(e.target===modal) finish(false); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    modal.addEventListener('click', onBackdrop);
  });
}
function promptDialog(message, defaultValue, isPassword){
  return new Promise(resolve=>{
    const modal = document.getElementById('promptModal');
    document.getElementById('promptMessage').textContent = message;
    const input = document.getElementById('promptInputField');
    input.type = isPassword ? 'password' : 'text';
    input.value = defaultValue || '';
    modal.classList.add('show');
    setTimeout(()=>{ input.focus(); input.select(); }, 60);
    const okBtn = document.getElementById('promptOkBtn');
    const cancelBtn = document.getElementById('promptCancelBtn');
    const finish = (result) => {
      modal.classList.remove('show');
      okBtn.removeEventListener('click', onOk);
      cancelBtn.removeEventListener('click', onCancel);
      input.removeEventListener('keydown', onKey);
      modal.removeEventListener('click', onBackdrop);
      resolve(result);
    };
    const onOk = () => finish(input.value);
    const onCancel = () => finish(null);
    const onKey = (e) => { if(e.key==='Enter'){ e.preventDefault(); onOk(); } };
    const onBackdrop = (e) => { if(e.target===modal) finish(null); };
    okBtn.addEventListener('click', onOk);
    cancelBtn.addEventListener('click', onCancel);
    input.addEventListener('keydown', onKey);
    modal.addEventListener('click', onBackdrop);
  });
}

const STORE_LAT = 37.4016411;
const STORE_LNG = 126.723068;
const GEOFENCE_RADIUS_M = 100;
function distanceMeters(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI/180;
  const dLat = toRad(lat2-lat1);
  const dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  const c = 2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R*c;
}
function checkGeofence(){
  if(!navigator.geolocation){
    state.geoStatus = 'unsupported';
    renderAll();
    return;
  }
  state.geoStatus = 'checking';
  renderAll();
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const dist = distanceMeters(pos.coords.latitude, pos.coords.longitude, STORE_LAT, STORE_LNG);
      state.geoDistance = Math.round(dist);
      state.geoStatus = dist <= GEOFENCE_RADIUS_M ? 'ok' : 'far';
      renderAll();
    },
    (err)=>{
      state.geoStatus = (err && err.code === 1) ? 'denied' : 'error';
      renderAll();
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:10000 }
  );
}

async function copyTextForShare(text){
  try{
    if(navigator.clipboard&&window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
    const area=document.createElement('textarea');
    area.value=text;
    area.style.position='fixed';
    area.style.opacity='0';
    document.body.appendChild(area);
    area.focus(); area.select();
    const copied=document.execCommand('copy');
    area.remove();
    return copied;
  }catch(e){ return false; }
}
async function shareOrderToKakao(id){

  if(!order){ showToast('공유할 발주요청을 찾지 못했어요',true); return; }
  const text=orderShareText(order);
  const appUrl=/^https?:/.test(location.href)?location.href.split('#')[0]:'';
  if(navigator.share){
    try{
      await navigator.share({title:'홍대구루메 발주요청',text,...(appUrl?{url:appUrl}:{})});
      return;
    }catch(e){
      if(e&&e.name==='AbortError') return;
    }
  }
  const copied=await copyTextForShare(text+(appUrl?`\n앱에서 확인: ${appUrl}`:''));
  showToast(copied?'발주 내용을 복사했어요. 카카오톡에 붙여넣어주세요':'공유 기능을 사용할 수 없어요',!copied);
}

/* ---------------- 오늘의 할 일 · 디지털 자석 칠판 ---------------- */
function taskBoardDate(){
  return state.taskBoardView==='tomorrow' ? addDays(new Date(),1) : new Date();
}
function taskBoardIso(){ return isoDate(taskBoardDate()); }
function taskBoardCatalogTask(category,index,item){
  if(!item) return null;
  if(typeof item==='string'){
    return {taskId:`${category.id}-${index}`,label:item,categoryId:category.id,categoryName:category.name};
  }
  if(item.taskId&&item.label){
    return {taskId:item.taskId,label:item.label,categoryId:category.id,categoryName:category.name};
  }
  return null;
}
function taskBoardTaskDef(taskId){
  for(const category of TASK_BOARD_CATEGORIES){
    for(let index=0;index<category.tasks.length;index++){
      const def=taskBoardCatalogTask(category,index,category.tasks[index]);
      if(def&&def.taskId===taskId) return def;
    }
  }
  return null;
}
function taskBoardDayRecord(iso){
  const raw=state.taskBoardData&&state.taskBoardData.dates&&state.taskBoardData.dates[iso];
  return {
    active:raw&&Array.isArray(raw.active)?raw.active:[],
    completed:raw&&Array.isArray(raw.completed)?raw.completed:[]
  };
}
async function saveTaskBoardDay(iso,record){
  const dates={...((state.taskBoardData&&state.taskBoardData.dates)||{}),[iso]:record};
  state.taskBoardData={dates};
  await saveJSON(TASK_BOARD_KEY,state.taskBoardData,true);
}
async function loadTaskBoard(){
  const saved=await loadJSON(TASK_BOARD_KEY,true,{dates:{}});
  let changed=false;
  const dates={};
  Object.entries(saved&&saved.dates?saved.dates:{}).forEach(([iso,raw])=>{
    const syncItems=(items)=>(Array.isArray(items)?items:[]).map(item=>{
      const def=taskBoardTaskDef(item.taskId||'');
      if(!def) return item;
      if(item.label!==def.label || item.categoryId!==def.categoryId || item.categoryName!==def.categoryName){
        changed=true;
        return {...item,label:def.label,categoryId:def.categoryId,categoryName:def.categoryName};
      }
      return item;
    });
    dates[iso]={...(raw||{}),active:syncItems(raw&&raw.active),completed:syncItems(raw&&raw.completed)};
  });
  state.taskBoardData={dates};
  if(changed) await saveJSON(TASK_BOARD_KEY,state.taskBoardData,true);
}
async function addTaskBoardItem(taskId){
  const def=taskBoardTaskDef(taskId);
  if(!def) return;
  const iso=taskBoardIso();
  const record=taskBoardDayRecord(iso);
  if(record.active.some(item=>item.taskId===taskId)){
    showToast('이미 위의 할 일에 올라가 있어요');
    return;
  }
  const name=await ensureName();
  const entry={id:genId(),...def,addedBy:name,addedAt:fullTimeLabel()};
  await saveTaskBoardDay(iso,{...record,active:[...record.active,entry]});
  renderAll();
  showToast(`${def.label} · ${state.taskBoardView==='tomorrow'?'내일':'오늘'} 할 일에 올렸어요`);
}
async function finishTaskBoardItem(id){
  const iso=taskBoardIso();
  const record=taskBoardDayRecord(iso);
  const target=record.active.find(item=>item.id===id);
  if(!target) return;
  if(state.taskBoardView==='tomorrow'){
    await saveTaskBoardDay(iso,{...record,active:record.active.filter(item=>item.id!==id)});
    renderAll();
    showToast('내일 할 일에서 뺐어요');
    return;
  }
  const name=await ensureName();
  const completed={...target,completedBy:name,completedAt:fullTimeLabel()};
  await saveTaskBoardDay(iso,{
    active:record.active.filter(item=>item.id!==id),
    completed:[completed,...record.completed]
  });
  renderAll();
  showToast(`${target.label} 완료 ✓`);
}

/* ---------------- 관리자 전용 날짜별 손익 ---------------- */
function parseMoneyValue(v){
  if(v===null || v===undefined || v==='') return 0;
  const n = Number(String(v).replace(/,/g,'').trim());
  return Number.isFinite(n) ? n : 0;
}
function moneyText(n){
  const num = Number(n)||0;
  const sign = num < 0 ? '-' : '';
  return sign + Math.abs(Math.round(num)).toLocaleString('ko-KR') + '원';
}
function profitDefaultRecord(){
  return {sales:0,fixedCost:0,purchaseCost:0,photoUrl:null,by:'',at:''};
}
function profitCalc(data){
  const sales=parseMoneyValue(data&&data.sales);
  const fixed=parseMoneyValue(data&&data.fixedCost);
  const purchase=parseMoneyValue(data&&data.purchaseCost);
  const profit=sales-fixed-purchase;
  const rate=sales>0 ? (profit/sales*100) : 0;
  return {sales,fixed,purchase,profit,rate};
}
function profitHasRecord(rec){
  if(!rec || typeof rec!=='object') return false;
  return !!(rec.by || rec.at || rec.photoUrl || parseMoneyValue(rec.sales) || parseMoneyValue(rec.fixedCost) || parseMoneyValue(rec.purchaseCost));
}
function dateFromIsoLocal(iso){
  const [y,m,d]=(iso||'').split('-').map(Number);
  return new Date(y,m-1,d);
}
function profitDateLabel(iso){
  const d=dateFromIsoLocal(iso);
  const dow=['일','월','화','수','목','금','토'][d.getDay()];
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${dow})`;
}
async function loadProfitDate(iso){
  state.profitDate=iso;
  state.profitData=await loadJSON(profitKeyForDate(iso), true, profitDefaultRecord());
  if(!state.profitData || typeof state.profitData!=='object') state.profitData=profitDefaultRecord();
}
async function loadProfitMonth(monthDate){
  const y=monthDate.getFullYear(), m=monthDate.getMonth();
  state.profitCalMonth=new Date(y,m,1);
  const lastDay=new Date(y,m+1,0).getDate();
  const reads=[];
  for(let day=1; day<=lastDay; day++){
    const iso=isoDate(new Date(y,m,day));
    reads.push(loadJSON(profitKeyForDate(iso), true, null).then(rec=>({iso,rec})));
  }
  const rows=await Promise.all(reads);
  const map={};
  rows.forEach(({iso,rec})=>{ if(profitHasRecord(rec)) map[iso]=rec; });
  state.profitMonthData=map;
}

  const base=state.profitCalMonth||new Date();
  const selected=dateFromIsoLocal(state.profitDate||isoDate(new Date()));
  const target=new Date(base.getFullYear(),base.getMonth()+delta,1);
  const maxDay=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();
  const nextDay=Math.min(selected.getDate(),maxDay);
  await loadProfitMonth(target);
  await loadProfitDate(isoDate(new Date(target.getFullYear(),target.getMonth(),nextDay)));

function profitCalendarHtml(){
  const month=state.profitCalMonth||new Date();
  const y=month.getFullYear(), m=month.getMonth();
  const firstDow=new Date(y,m,1).getDay();
  const lastDay=new Date(y,m+1,0).getDate();
  const todayIso=isoDate(new Date());
  const selectedIso=state.profitDate||todayIso;
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let day=1;day<=lastDay;day++){
    const iso=isoDate(new Date(y,m,day));
    const rec=state.profitMonthData&&state.profitMonthData[iso];
    const has=profitHasRecord(rec);
    const calc=has?profitCalc(rec):null;
    const cls=[
      'cal-cell',
      iso===todayIso?'today':'',
      iso===selectedIso?'selected':'',
      has?'profit-recorded':'',
      has&&calc.profit<0?'profit-negative':''
    ].filter(Boolean).join(' ');
    const sub=has ? `${Math.round(calc.rate)}%` : '—';
    cells.push(`<button type="button" class="${cls}" data-action="profitDateSelect" data-date="${iso}"><span>${day}</span><span class="cal-pct">${sub}</span></button>`);
  }
  return `
    <div class="cal-card profit-calendar">
      <div class="cal-nav">
        <button type="button" data-action="profitPrevMonth" aria-label="이전 달">‹</button>
        <span class="label">${y}년 ${m+1}월 손익 기록</span>
        <button type="button" data-action="profitNextMonth" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid">
        ${['일','월','화','수','목','금','토'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}
        ${cells.join('')}
      </div>
      <div class="profit-selected-label">선택 날짜 · ${profitDateLabel(selectedIso)}</div>
    </div>`;

async function loadJSON(key, shared, fallback){

      const { data, error } = await sb.from('kv_store').select('value').eq('key', key).maybeSingle();

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('read fail'));
    reader.onload = ()=>{
      img.onerror = ()=> reject(new Error('img fail'));
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function captureBurstPhoto(){
  const video = document.getElementById('burstVideo');
  const it = currentBurstItem();
  if(!video || !video.videoWidth || !it) return;
  const maxDim = 1600;
  let w = video.videoWidth, h = video.videoHeight;
  if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
  else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width=w; canvas.height=h;
  canvas.getContext('2d').drawImage(video,0,0,w,h);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
  state.burstSession.results[burstItemKey(it)] = {
    sectionId: it.sectionId, sectionName: it.sectionName, itemId: it.itemId, itemLabel: it.itemLabel,
    url: dataUrl, note:'', capturedAt: nowHM(), source:'burst'
  };
  saveBurstDraft();
  renderBurstOverlay();
  burstFlashCheck();
  setTimeout(burstGoNext, 650);
}
function burstGoNext(){
  if(!state.burstSession) return;
  if(state.burstSession.index < state.burstSession.items.length-1){
    state.burstSession.index++;
    renderBurstOverlay();
  } else {
    openReviewScreen();
  }
}
function burstGoPrev(){
  if(!state.burstSession || state.burstSession.index<=0) return;
  state.burstSession.index--;
  renderBurstOverlay();
}
function burstSkip(){ burstGoNext(); }
function burstRetake(){
  const it = currentBurstItem();
  if(!it) return;
  delete state.burstSession.results[burstItemKey(it)];
  saveBurstDraft();
  renderBurstOverlay();
}
function renderBurstOverlay(){
  const session = state.burstSession;
  if(!session) return;
  const it = session.items[session.index];
  const total = session.items.length;
  const progressEl = document.getElementById('burstProgress');
  if(progressEl) progressEl.textContent = `${session.index+1}/${total}`;
  const labelEl = document.getElementById('burstItemLabel');
  if(labelEl) labelEl.textContent = `${it.sectionName} · ${it.itemLabel}`;
  const existing = session.results[burstItemKey(it)];
  const video = document.getElementById('burstVideo');
  const img = document.getElementById('burstPreviewImg');
  const shutterBtn = document.getElementById('burstShutterBtn');
  const retakeBtn = document.getElementById('burstRetakeBtn');
  if(existing){
    if(img){ img.src = existing.url; img.style.display='block'; }
    if(video) video.style.display='none';
    if(retakeBtn) retakeBtn.style.display='';
    if(shutterBtn) shutterBtn.style.display='none';
  } else {
    if(img) img.style.display='none';
    if(video) video.style.display='block';
    if(retakeBtn) retakeBtn.style.display='none';
    if(shutterBtn) shutterBtn.style.display='';
  }
  const prevBtn = document.getElementById('burstPrevBtn');
  if(prevBtn) prevBtn.disabled = session.index===0;
  const strip = document.getElementById('burstThumbstrip');
  if(strip){
    strip.innerHTML = session.items.map((x,i)=>{
      const has = !!session.results[burstItemKey(x)];
      return `<span class="burst-dot ${has?'done':''} ${i===session.index?'active':''}"></span>`;
    }).join('');
  }
}

          ${en.unassigned ? `
            <select class="review-assign-select" data-action="reviewAssignSelect" data-tempkey="${key}">
              <option value="">📌 항목을 선택해주세요</option>
              ${session.items.map(it=>`<option value="${it.sectionId}#${it.itemId}">${escapeHtml(it.sectionName)} · ${escapeHtml(it.itemLabel)}</option>`).join('')}
            </select>

            ${en.unassigned ? '' : `<button type="button" data-action="reviewRetake" data-key="${key}">다시 찍기</button>`}
            <button type="button" class="danger" data-action="reviewDelete" data-key="${key}">삭제</button>
          </div>
        </div>
      </div>
    `).join('') : '<div class="empty-note">촬영되거나 선택된 사진이 없어요.</div>';
  }
  const unassignedCount = entries.filter(([k,en])=>en.unassigned).length;
  let summary = `총 ${entries.length}장`;
  if(missing.length) summary += ` · 사진 없는 항목 ${missing.length}개`;
  if(unassignedCount) summary += ` · 항목 미지정 ${unassignedCount}장`;

function daysSinceIso(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const then = new Date(y,m-1,d);
  const now = new Date(); const nowStart = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.round((nowStart-then)/86400000);
}

function hmMinutes(hm){
  const parts = String(hm||'').split(':').map(Number);
  return parts.length===2 && parts.every(Number.isFinite) ? parts[0]*60+parts[1] : null;
}
function durationText(startHm, endHm){
  const start = hmMinutes(startHm), end = hmMinutes(endHm);
  if(start===null || end===null || end<start) return '';
  const mins = end-start;
  return `${Math.floor(mins/60)}시간 ${mins%60}분`;
}
function scheduledNamesForDay(dd){
  const entries = (state.attendanceScheduleMonth && state.attendanceScheduleMonth[dd]) || [];
  const names = entries.map(e=>{
    if(e && e.status==='confirmed' && e.coveredBy) return e.coveredBy;
    return e && e.name;
  }).filter(Boolean);
  return [...new Set(names)];
}
function attendancePeopleForDay(dd, dateObj){
  const logs = (state.attendanceMonth[dd]||[]).slice();
  const scheduledNames = scheduledNamesForDay(dd);
  const logNames = logs.map(r=>r.name).filter(Boolean);
  const names = [...new Set([...scheduledNames, ...logNames])];
  const todayIso = isoDate(new Date());
  const selectedIso = isoDate(dateObj);
  const nowMins = new Date().getHours()*60+new Date().getMinutes();
  return names.map(name=>{
    const mine = logs.filter(r=>r.name===name);
    const ins = mine.filter(r=>r.type==='in');
    const outs = mine.filter(r=>r.type==='out');
    const firstIn = ins[0] || null;
    const lastOut = outs.length ? outs[outs.length-1] : null;
    const planned = scheduledNames.includes(name);
    const late = !!(firstIn && firstIn.status==='late');
    const early = !!(lastOut && lastOut.status==='early');
    const lateMins = firstIn ? Math.max(0,(hmMinutes(firstIn.at)||0)-10*60) : 0;
    let kind='waiting', label='출근 예정';
    if(firstIn){ kind=late?'late':'normal'; label=late?'지각':'정상'; }
    if(lastOut){ kind=early?'early':'done'; label=early?'조퇴':'근무 완료'; }
    if(!firstIn && planned && (selectedIso<todayIso || (selectedIso===todayIso && nowMins>10*60))){ kind='missing'; label='미출근'; }
    return {name,mine,firstIn,lastOut,planned,late,early,lateMins,kind,label};
  });
}
function attendanceIssueCounts(dd, dateObj){
  const people = attendancePeopleForDay(dd,dateObj);
  return {
    late:people.filter(p=>p.late).length,
    early:people.filter(p=>p.early).length,
    missing:people.filter(p=>p.kind==='missing').length,
    recorded:people.filter(p=>p.firstIn).length
  };
}
async function recordAttendance(type){
  if(state.geoStatus !== 'ok'){
    showToast('매장 반경 100m 이내에서만 출퇴근을 기록할 수 있어요', true);
    return;
  }
  const name = await ensureName();
  const now = new Date();
  if(!state.attendanceCalMonth || ymKey(state.attendanceCalMonth)!==ymKey(now)) await loadAttendanceMonth(now);
  state.attendanceSelectedDate = new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const hm = nowHM();
  const mins = now.getHours()*60+now.getMinutes();
  let status = 'ontime';
  if(type==='in' && mins > 10*60) status='late';
  if(type==='out' && mins < 21*60+30) status='early';
  const lateMins = (type==='in' && status==='late') ? (mins - 10*60) : 0;
  const dd = dKey(now);
  const list = (state.attendanceMonth[dd]||[]).slice();
  list.push({ name, type, at:hm, status });

    const overdue = remaining !== null && remaining <= 0;

    const dotsTotal = Math.min(t.intervalDays, 10);
    const filled = since===null ? 0 : Math.min(since, dotsTotal);
    const dots = Array.from({length:dotsTotal}, (_,i)=> `<span class="rc-dot ${i<filled?'on':''}"></span>`).join('');

function attendanceCalendarHtml(){
  const month = state.attendanceCalMonth || new Date();
  const y=month.getFullYear(), m=month.getMonth();
  const firstDow=new Date(y,m,1).getDay();
  const lastDay=new Date(y,m+1,0).getDate();
  const selectedIso=isoDate(state.attendanceSelectedDate||new Date());
  const todayIso=isoDate(new Date());
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push('<div class="cal-cell empty"></div>');
  for(let day=1;day<=lastDay;day++){
    const dt=new Date(y,m,day), iso=isoDate(dt), dd=pad2(day);
    const counts=attendanceIssueCounts(dd,dt);
    let status='—', statusClass='';
    if(counts.missing){ status=`미출근 ${counts.missing}`; statusClass='issue'; }
    else if(counts.early){ status=`조퇴 ${counts.early}`; statusClass='issue'; }
    else if(counts.late){ status=`지각 ${counts.late}`; statusClass='late'; }
    else if(counts.recorded){ status='정상'; statusClass='normal'; }
    const cls=['cal-cell','att-cal-cell',iso===todayIso?'today':'',iso===selectedIso?'selected':''].filter(Boolean).join(' ');
    cells.push(`<button type="button" class="${cls}" data-action="attDateSelect" data-date="${iso}"><span>${day}</span><span class="att-cal-status ${statusClass}">${status}</span></button>`);
  }
  return `
    <div class="cal-card">
      <div class="cal-nav">
        <button type="button" data-action="attPrevMonth" aria-label="이전 달">‹</button>

function attendancePersonCardsHtml(people, isToday){

function showAttendanceEmployeeDetail(name){
  if(!state.isAdmin){ showToast('관리자만 직원별 기록을 볼 수 있어요', true); return; }
  const month=state.attendanceCalMonth||new Date();
  const lastDay=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();
  const rows=[]; let normal=0,late=0,early=0,worked=0,missing=0;
  for(let day=1;day<=lastDay;day++){

    rows.push(`<div class="att-detail-row"><div class="att-detail-row-top"><span>${month.getMonth()+1}월 ${day}일</span><span class="badge ${p.late?'late':(p.early?'early':'ontime')}">${escapeHtml(p.label)}</span></div><div class="att-detail-row-sub">${times}<br>${detail}</div></div>`);

      const irec = rec.items[key];
      const isDone = !!irec;

      if(!state.editMode && state.hideCompleted && isDone) return '';

      if(state.editMode){
        return `
          <div class="edit-item-block">
            <div class="row1">
              <div class="move-btns">
                <button type="button" data-action="moveItemUp" data-section="${sec.id}" data-item="${item.id}" title="위로">▲</button>

              <input class="edit-input" type="text" value="${escapeHtml(item.label)}" data-action="labelField" data-section="${sec.id}" data-item="${item.id}" style="flex:1;">

              <input class="url-input" id="url_${sec.id}_${item.id}" type="text" value="${escapeHtml(item.manualUrl||'')}" placeholder="📎 매뉴얼 사진/영상 링크 (선택)" data-action="urlField" data-section="${sec.id}" data-item="${item.id}" style="flex:1;">

            </div>
          </div>
        `;
      }

      const checked = !!(irec && irec.checked);
      const retakeKey = sec.id+'#'+item.id;
      const retakeReq = rec.photoRetakeRequests && rec.photoRetakeRequests[retakeKey];
      return `
        <div class="item-row">
          <span class="box ${checked?'checked':''}" data-action="toggleItem" data-section="${sec.id}" data-item="${item.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </span>
          ${item.manualUrl?`<button class="manual-btn" data-action="openManual" data-url="${escapeHtml(item.manualUrl)}" title="매뉴얼 보기">📎</button>`:''}

            <span class="txt ${checked?'checked':''}" data-action="toggleItem" data-section="${sec.id}" data-item="${item.id}">${escapeHtml(item.label)}</span>
            ${checked ? `<div class="item-meta">${escapeHtml(irec.by)} · ${irec.at}</div>` : ''}
            ${retakeReq ? `
              <div class="item-retake-banner">
                <span>🔴 관리자가 재촬영을 요청했어요${retakeReq.note?` — ${escapeHtml(retakeReq.note)}`:''}</span>
                <button type="button" data-action="itemRetakeShot" data-key="${retakeKey}">재촬영</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
    }).join('');
    const allHiddenDone = !state.editMode && state.hideCompleted && itemsHtml.trim()==='' && items.length>0;

    const addRow = state.editMode ? `
      <div class="add-item-row">
        <input type="text" id="addItemInput_${sec.id}" placeholder="새 항목 입력">
        <button data-action="addItemRow" data-section="${sec.id}">추가</button>
      </div>` : '';

    const photos = rec.photos && rec.photos[sec.id] ? rec.photos[sec.id] : [];
    const photoGalleryOpen = !!state.openPhotoGalleries[sectionPhotoViewKey(sec.id)];
    const photoSummaryHtml = photos.length ? `
      <div class="section-photo-summary">
        <button type="button" class="section-photo-summary-btn ${photoGalleryOpen?'open':''}" data-action="toggleSectionPhotos" data-section="${sec.id}" aria-expanded="${photoGalleryOpen?'true':'false'}">
          <span class="photo-label">📷 업무 사진 ${photos.length}장</span>
          <span class="photo-arrow" aria-hidden="true">›</span>
        </button>
      </div>
    ` : '';
    const photosHtml = photos.length && photoGalleryOpen ? `
      <div class="section-photo-drawer">
        <div class="section-photo-drawer-head"><span>사진을 누르면 크게 볼 수 있어요</span><span>총 ${photos.length}장</span></div>
        <div class="section-photo-grid">
          ${photos.map(p=>`
            <div>
              <div class="ph-thumb">
                <img src="${escapeHtml(p.url)}" data-action="openManual" data-url="${escapeHtml(p.url)}" alt="${escapeHtml(sec.name)} 업무 사진">
                ${isSuperAdmin()?`<button type="button" class="ph-del" data-action="deleteSectionPhoto" data-section="${sec.id}" data-photo="${p.id}" aria-label="사진 삭제">×</button>`:''}
              </div>
              <div class="section-photo-meta">${escapeHtml(p.by||'')} · ${escapeHtml(p.at||'')}</div>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';

    const capsuleRow = (!state.editMode && isOpen && items.length>0 && items.length<=8) ? `
      <div class="cap-row">
        ${items.map((it,idx)=>{
          const done = !!rec.items[sec.id+'#'+it.id];
          return `<span class="cap ${done?'on':''}">${done?'✓':idx+1}</span>`;
        }).join('')}
      </div>
    ` : '';

    const showCamBtn = sectionHasCamera(sec.id);

    return `
      <div class="section ${isOpen?'open':''}">
        <div class="section-head" data-action="sectionToggle" data-section="${sec.id}">
          <span class="name">${escapeHtml(sec.name)}${showCamBtn?`<button type="button" class="cam-btn" data-action="sectionCamera" data-section="${sec.id}" title="사진 촬영">${CAMERA_ICON_SVG}</button>`:''}</span>
          <span class="meta">
            <span class="count">${doneCount}/${items.length}</span>

            <span class="chev"></span>

        </div>

        <div class="items">${allHiddenDone?'<div class="empty-note">모두 완료했어요 🎉</div>':itemsHtml}${addRow}</div>

function inventoryRowHtml(sec, item, rec){
  const key = sec.id+'#'+item.id;
  const irec = rec.items[key];

  if(state.editMode){
    return `
      <div class="edit-item-block">
        <div class="row1">
          <div class="move-btns">
            <button type="button" data-action="moveItemUp" data-section="${sec.id}" data-item="${item.id}" title="위로">▲</button>
            <button type="button" data-action="moveItemDown" data-section="${sec.id}" data-item="${item.id}" title="아래로">▼</button>
          </div>
          <input class="edit-input" type="text" value="${escapeHtml(item.label)}" data-action="labelField" data-section="${sec.id}" data-item="${item.id}" style="flex:1;">
          <button class="del-btn" data-action="deleteItem" data-section="${sec.id}" data-item="${item.id}" data-label="${escapeHtml(item.label)}">×</button>
        </div>
        <div class="row2">
          <span class="mini-label">기준수량</span>
          <input class="thresh-input" type="number" value="${item.threshold==null?'':item.threshold}" placeholder="1" data-action="threshField" data-section="${sec.id}" data-item="${item.id}">
          <span class="mini-label">단위</span>
          <input class="unit-input" type="text" value="${escapeHtml(item.unit||'')}" placeholder="통" data-action="unitField" data-section="${sec.id}" data-item="${item.id}">
        </div>
        <div style="display:flex;gap:6px;">
          <input class="url-input" id="url_${sec.id}_${item.id}" type="text" value="${escapeHtml(item.manualUrl||'')}" placeholder="📎 매뉴얼 사진/영상 링크 (선택)" data-action="urlField" data-section="${sec.id}" data-item="${item.id}" style="flex:1;">
          <button type="button" class="manual-btn" data-action="previewUrlField" data-target="url_${sec.id}_${item.id}" title="미리보기">👁</button>
        </div>
      </div>
    `;
  }

  const val = irec ? irec.value : '';
  const low = (item.threshold!=null && irec && irec.value < item.threshold);
  const metaLine = irec
    ? `<div class="item-meta">${escapeHtml(irec.by)} · ${irec.at}${low?' · <span style="color:var(--red);font-weight:700;">재고 부족</span>':''}</div>`
    : (item.threshold!=null ? `<div class="item-meta">기준 ${item.threshold}${escapeHtml(item.unit||'')}</div>` : '');
  return `
    <div class="item-row numtype">
      ${item.manualUrl?`<button class="manual-btn" data-action="openManual" data-url="${escapeHtml(item.manualUrl)}" title="매뉴얼 보기">📎</button>`:''}
      <div style="flex:1;">
        <div class="txt">${escapeHtml(item.label)}</div>
        ${metaLine}
      </div>
      <input type="number" class="num-input ${low?'low':''}" value="${val}" placeholder="${item.threshold==null?0:item.threshold}" step="any" inputmode="${item.unit==='kg'?'decimal':'numeric'}" data-action="numField" data-section="${sec.id}" data-item="${item.id}">
      <span class="num-unit">${escapeHtml(item.unit||'')}</span>
    </div>
  `;
}

function fmtOrderDateHeader(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${m}월 ${d}일 (${dow})`;
}
function orderGroupHtml(list){
  const groups = [];
  const byDate = {};
  list.forEach(o=>{
    if(!byDate[o.dateIso]){ byDate[o.dateIso] = []; groups.push(o.dateIso); }
    byDate[o.dateIso].push(o);
  });
  const row = (o)=>{
    const isDone = o.status==='done';
    const doneStyle = isDone ? 'text-decoration:line-through;color:var(--text-faint);' : '';
    const noteHtml = escapeHtml(o.note) || '<span style="color:var(--text-faint);">(사진만 첨부됨)</span>';
    const badge = isDone ? `<span class="order-status-badge">✓ 완료</span>` : '';
    if(o.photoUrl){
      return `
        <div class="order-card ${isDone?'done':''}">
          <div class="order-card-photo-wrap">
            <img class="order-card-photo" src="${escapeHtml(o.photoUrl)}" data-action="openManual" data-url="${escapeHtml(o.photoUrl)}" alt="발주 사진">
            ${isDone ? `<span class="order-badge-overlay">✓ 발주완료</span>` : ''}
          </div>
          <div class="order-card-body">
            <div class="order-card-txt" style="${doneStyle}">${noteHtml}</div>
            <div class="order-card-meta">${escapeHtml(o.by)}</div>
          </div>
          <div class="order-card-actions">
            <button class="order-kakao-share" data-action="shareOrderKakao" data-id="${o.id}">💬 카카오톡 공유</button>
            ${state.isAdmin?`<button class="${isDone?'undo':'ok'}" data-action="toggleOrderStatus" data-id="${o.id}">${isDone?'↺ 되돌리기':'✓ 완료 처리'}</button>`:''}
            ${isSuperAdmin()?`<button class="danger" data-action="deleteOrderRequest" data-id="${o.id}">× 삭제</button>`:''}
          </div>
        </div>
      `;
    }
    return `
      <div class="list-row ${isDone?'order-done-row':''}">
        <div class="body">
          <div class="txt" style="${doneStyle}">${noteHtml}${badge}</div>
          <div class="meta">${escapeHtml(o.by)}</div>
        </div>
        <button class="order-share-mini" data-action="shareOrderKakao" data-id="${o.id}">톡 공유</button>
        ${state.isAdmin?`<button class="order-toggle-btn ${isDone?'done':''}" data-action="toggleOrderStatus" data-id="${o.id}" title="${isDone?'요청중으로 되돌리기':'완료 처리'}">${isDone?'↺':'✓'}</button>`:''}
        ${isSuperAdmin()?`<button class="del" data-action="deleteOrderRequest" data-id="${o.id}">×</button>`:''}
      </div>
    `;
  };
  return groups.map(iso=>`
    <div class="order-date-group">
      <div class="order-date-header">${fmtOrderDateHeader(iso)}</div>
      ${byDate[iso].map(row).join('')}
    </div>
  `).join('');
}

function inventoryHtml(){
  const station = currentStation();
  const persistent=!!station.persistentInventory;
  const selKey = dKey(state.selectedDay);
  const rec = persistent
    ? {items:{...((state.otherInventoryData&&state.otherInventoryData.items)||{})}}
    : getDayRecord(selKey);
  const total = stationInventoryTotal(station);
  const done = doneInventoryCount(rec, station);
  const pct = total ? Math.round((done/total)*100) : 0;

  const groups = station.sections.map(sec=>{
    const items = sectionNumberItems(sec);
    if(items.length===0 && !sec.id.endsWith('_inventory')) return '';
    const rows = items.map(item=>inventoryRowHtml(sec, item, rec)).join('');
    const doneHere = items.filter(it=>rec.items[sec.id+'#'+it.id]).length;
    const addRow = state.editMode ? `
      <div class="add-item-row">
        <input type="text" id="addInvInput_${sec.id}" placeholder="새 재고 항목 입력">
        <button data-action="addInvRow" data-section="${sec.id}">추가</button>
      </div>` : '';
    return `
      <div class="section open">
        <div class="inv-cat-head">
          <span>${escapeHtml(sec.name)}</span>
          <span>${doneHere}/${items.length}</span>
        </div>
        <div class="items">${rows || '<div class="empty-note">등록된 재고 항목이 없어요</div>'}${addRow}</div>
      </div>
    `;
  }).join('');

  return `
    <div class="overall">
      <div class="overall-row">
        <span class="overall-title">${persistent?'상시 유지':fmtDate(state.selectedDay)} · ${station.name} 재고 확인</span>
        <span class="overall-pct">${pct}%</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="overall-sub">${done} / ${total}개 재고 항목 확인${persistent?' · 입력한 수량은 날짜가 바뀌어도 유지됩니다':''}</div>
    </div>
    <div class="day-banner">
      <span class="d">${persistent?'📦 기타재고 · 상시 수량':fmtDate(state.selectedDay)+' 재고'}</span>
      <span class="btns">
        ${persistent?'':`<button class="link-btn" data-action="goToday">오늘로</button>`}
        ${isSuperAdmin() ? `<button class="link-btn ${state.editMode?'on':''}" data-action="editToggle">${state.editMode?'편집 완료':'항목 편집'}</button>` : ''}
      </span>
    </div>
    ${persistent?'<div class="empty-note" style="margin:10px 2px 12px;text-align:left;">매일 초기화되지 않는 상시 재고입니다. 현재 수량이 바뀔 때만 수정해주세요.</div>':''}
    ${groups || '<div class="empty-note" style="margin-top:14px;">등록된 재고 항목이 없어요. "항목 편집"을 눌러 추가해보세요.</div>'}
  `;
}

const bottomNavEl = document.getElementById('bottomNav');
function renderBottomNav(){
  bottomNavEl.innerHTML = NAV_TABS.map(t=>`
    <button class="nav-btn ${(state.mainTab===t.id || (t.id==='more'&&['schedule','parcel','profit','audit','orderHistory'].includes(state.mainTab)))?'active':''}" data-tab="${t.id}">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${t.svg}</svg></span>
      <span>${t.label}</span>
    </button>
  `).join('');
}
bottomNavEl.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-tab]');
  if(!el) return;
  state.mainTab = el.dataset.tab;
  if(state.mainTab==='todayTasks') await loadTaskBoard();
  if(state.mainTab==='attend' && !state.isAdmin){
    const now=new Date();
    await loadAttendanceMonth(now);
    state.attendanceSelectedDate=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  }
  renderAll();
  window.scrollTo(0,0);
  if(state.mainTab==='attend') checkGeofence();
});

function renderAll(){
  renderTabs();
  if(state.mainTab==='home') appEl.innerHTML = renderHomeTab();
  else if(state.mainTab==='todayTasks') appEl.innerHTML = renderTaskBoardTab();
  else if(state.mainTab==='attend') appEl.innerHTML = renderAttendTab();
  else if(state.mainTab==='schedule') appEl.innerHTML = renderScheduleTab();
  else if(state.mainTab==='parcel') appEl.innerHTML = renderParcelTab();
  else if(state.mainTab==='notice') appEl.innerHTML = renderNoticeTab();
  else if(state.mainTab==='profit') appEl.innerHTML = renderProfitTab();
  else if(state.mainTab==='audit') appEl.innerHTML = renderAuditTab();
  else if(state.mainTab==='orderHistory') appEl.innerHTML = renderOrderHistoryTab();
  else if(state.mainTab==='photoReview') appEl.innerHTML = renderPhotoReviewTab();
  else appEl.innerHTML = renderMoreTab();
  renderBottomNav();
  updateNoticeBadge();
}
function updateNoticeBadge(){
  const el = document.getElementById('noticeBellBadge');
  if(!el) return;
  const count = (state.notices||[]).length;
  if(count>0){
    el.textContent = count>99 ? '99+' : String(count);
    el.style.display = 'flex';
  } else {
    el.style.display = 'none';
  }
}

/* ---------------- 시작 ---------------- */
(async function init(){
  renderTabs();
  state.openSections[currentStation().sections[0].id] = true;

  let structure = await loadJSON(STRUCT_KEY, true, {});
  let changed = false;
  const stockMigrationVersion=Number(await loadJSON(STOCK_STRUCTURE_MIGRATION_KEY,true,0))||0;
  const runStockCleanup=stockMigrationVersion<STOCK_STRUCTURE_MIGRATION_VERSION;
  const removedOtherInventoryKeys=[];
  STATION_META.forEach(st=>{
    st.sections.forEach(sec=>{
      if(!structure[sec.id] || structure[sec.id].length===0){
        const defs = DEFAULT_ITEMS[sec.id] || [];
        if(defs.length>0){
          structure[sec.id] = defs.map((def, idx) => ({
            id:String(idx), label:def.label, type:def.type||'check',
            unit:def.unit||'', threshold:(def.threshold!==undefined?def.threshold:null), manualUrl:''
          }));
          changed = true;
        } else if(!structure[sec.id]){
          structure[sec.id] = [];
          changed = true;
        }
      }
    });
  });
  if(runStockCleanup){
    Object.entries(STOCK_STRUCTURE_REMOVALS).forEach(([sectionId,labels])=>{
      const removeSet=new Set(labels);
      const before=structure[sectionId]||[];
      before.forEach(item=>{ if(removeSet.has(item.label)) removedOtherInventoryKeys.push(sectionId+'#'+item.id); });
      const after=before.filter(item=>!removeSet.has(item.label));
      if(after.length!==before.length){ structure[sectionId]=after; changed=true; }
    });
    Object.entries(STOCK_UNIT_UPDATES).forEach(([sectionId,updates])=>{
      const unitMap=new Map(updates);
      structure[sectionId]=(structure[sectionId]||[]).map(item=>{
        const nextUnit=unitMap.get(item.label);
        if(nextUnit!==undefined && item.unit!==nextUnit){ changed=true; return {...item,unit:nextUnit}; }
        return item;
      });
    });
  }
  state.structure = structure;
  if(changed) await saveJSON(STRUCT_KEY, structure, true);

  state.notices = await loadJSON(NOTICES_KEY, true, []);
  state.adminAuditLogs = await loadJSON(AUDIT_KEY, true, []);
  await loadOrderNotices();
  await loadParcelEntries();
  await loadTaskBoard();
  const savedOtherInventory=await loadJSON(OTHER_INVENTORY_KEY,true,{items:{}});
  state.otherInventoryData=(savedOtherInventory&&savedOtherInventory.items)?savedOtherInventory:{items:{}};
  if(runStockCleanup){
    const cleanedItems={...(state.otherInventoryData.items||{})};
    let cleanedValues=false;
    removedOtherInventoryKeys.forEach(key=>{ if(Object.prototype.hasOwnProperty.call(cleanedItems,key)){ delete cleanedItems[key]; cleanedValues=true; } });
    if(cleanedValues){ state.otherInventoryData={items:cleanedItems}; await saveJSON(OTHER_INVENTORY_KEY,state.otherInventoryData,true); }
    await saveJSON(STOCK_STRUCTURE_MIGRATION_KEY,STOCK_STRUCTURE_MIGRATION_VERSION,true);
  }
  await loadAttendanceMonth(today);
  await loadScheduleForWeek(state.schedWeekStart);
  const savedSession = loadAuthSession();
  if(savedSession){
    state.authRole = savedSession.role;
    state.isAdmin = savedSession.role === 'admin' || savedSession.role === 'superadmin';
    state.myName = savedSession.name;
    state.loginPrefillName = savedSession.name;
  } else {
    state.authRole = null;
    state.isAdmin = false;
    state.myName = '';
    try{
      const raw = getPersonalRaw(NAME_KEY);
      state.loginPrefillName = raw || '';
    }catch(e){ state.loginPrefillName=''; }
  }

  await refreshMonthData();
  await refreshRecurringTasks();
  await refreshOrders();
  appReady = true;
  renderAll();
  updateNameBadge();
  if(state.authRole){
    hideLoginScreen();
    showToast(state.authRole==='superadmin' ? '최고관리자 모드로 로그인했어요' : (state.isAdmin ? `${state.myName}님, 관리자로 로그인했어요` : `${state.myName}님, 환영합니다`));
  } else showLoginScreen();
})();
</script>
</body>
</html>
