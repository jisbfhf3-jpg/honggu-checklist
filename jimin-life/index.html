<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>지민 라이프</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F2F4F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="지민라이프">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --soft:#F2F4F6; --line:#E5E8EB;
  --text:#191F28; --sub:#6B7684; --faint:#8B95A1;
  --blue:#3182F6; --blue-d:#1B64DA; --blue-50:#EFF5FF; --blue-100:#DCE9FE;
  --up:#F04452; --down:#3182F6; --green:#00B386; --amber:#FF9F1C;
  --nav:#FFFFFF; --overlay:rgba(15,20,30,.5);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 14px rgba(15,23,42,.05);
  --r:20px;
  --display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101318; --card:#1B1F26; --soft:#252A33; --line:#2C323C;
    --text:#ECEFF3; --sub:#A2ABB7; --faint:#7D8794;
    --blue-50:#1A2A44; --blue-100:#22385A; --nav:#161A20; --overlay:rgba(0,0,0,.6);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101318; --card:#1B1F26; --soft:#252A33; --line:#2C323C;
  --text:#ECEFF3; --sub:#A2ABB7; --faint:#7D8794;
  --blue-50:#1A2A44; --blue-100:#22385A; --nav:#161A20; --overlay:rgba(0,0,0,.6);
  --shadow:none;
}
*,*::before,*::after{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{margin:0;padding:0;}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;padding-bottom:100px;font-size:14px;line-height:1.45;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
.wrap{max-width:480px;margin:0 auto;padding:0 16px;}

/* header */
.head{max-width:480px;margin:0 auto;padding:20px 16px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:10px;}
.head h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;letter-spacing:-.01em;}
.head .date{font-size:12.5px;color:var(--sub);margin-top:2px;}
.sync{font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);color:var(--sub);white-space:nowrap;}
.sync.ok{color:var(--green);}

/* cards */
.card{margin-top:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;}
.card.tap{cursor:pointer;}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.card-h h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0;}
.card-h .more{font-size:12.5px;color:var(--faint);}
.add-btn{border:none;background:var(--blue-50);color:var(--blue-d);font-weight:700;font-size:12.5px;padding:7px 12px;border-radius:10px;}
:root[data-theme="dark"] .add-btn{color:#8BB8FE;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .add-btn{color:#8BB8FE;}}

.big{font-family:var(--display);font-size:32px;line-height:1.15;letter-spacing:-.01em;}
.mid{font-family:var(--display);font-size:21px;line-height:1.2;}
.lbl{font-size:12.5px;color:var(--sub);}
.muted{color:var(--faint);font-size:12.5px;}
.up{color:var(--up);} .down{color:var(--down);}
.row .s.up,.cols .up,.out-row .up{color:var(--up);} .row .s.down,.cols .down,.out-row .down{color:var(--down);}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--soft);color:var(--sub);}
.chip.red{background:rgba(240,68,82,.12);color:var(--up);}
.chip.blue{background:var(--blue-50);color:var(--blue);}
.chip.solid{background:var(--blue);color:#fff;}
.chip.green{background:rgba(0,179,134,.12);color:var(--green);}

/* segmented */
.seg{display:flex;gap:4px;padding:4px;background:var(--line);border-radius:14px;margin-top:14px;}
.seg button{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--sub);}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(20,30,60,.10);}
.seg.small{margin-top:0;margin-bottom:12px;}
.seg.small button{padding:7px 4px;font-size:12.5px;}

/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
.row:first-child{border-top:none;padding-top:2px;}
.row.tap{cursor:pointer;}
.row .main{flex:1;min-width:0;}
.row .t{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .s{font-size:12.5px;color:var(--faint);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .r{text-align:right;flex:0 0 auto;}
.row .r .t{font-family:var(--display);font-weight:400;font-size:16px;}
.dot{width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 auto;color:#fff;}
.ok-btn{border:none;background:var(--blue);color:#fff;font-weight:700;font-size:13px;padding:8px 13px;border-radius:11px;flex:0 0 auto;}
.ok-btn.ghost{background:var(--soft);color:var(--sub);}
.date-h{font-size:12.5px;font-weight:700;color:var(--sub);margin:16px 0 4px;display:flex;justify-content:space-between;}
.date-h:first-child{margin-top:0;}
.empty{text-align:center;color:var(--faint);padding:22px 8px;font-size:13.5px;}
.empty b{display:block;color:var(--sub);font-size:14px;margin-bottom:4px;}

.bar{height:8px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px;}
.bar i{display:block;height:100%;border-radius:6px;background:var(--blue);}
.bar.thin{height:5px;margin-top:6px;}
.stack{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:14px;background:var(--soft);}
.stack i{display:block;height:100%;}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--sub);}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:1px;}

.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.cols.two{grid-template-columns:repeat(2,1fr);}
.cols > div{background:var(--soft);border-radius:14px;padding:12px;}
.cols .v{font-family:var(--display);font-size:16px;margin-top:3px;word-break:keep-all;}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;}
.monthnav button{border:none;background:var(--card);box-shadow:var(--shadow);width:36px;height:36px;border-radius:12px;font-size:15px;color:var(--sub);}
.monthnav b{font-family:var(--display);font-weight:400;font-size:18px;}

.donut-wrap{display:flex;align-items:center;gap:16px;}
.donut-wrap svg{flex:0 0 auto;}
.cat-list{flex:1;min-width:0;}
.cat-list div{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;gap:6px;}
.cat-list div span:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:3px;background:var(--c);margin-right:6px;}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;}
.week div{font-size:11.5px;color:var(--faint);}
.week i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:4px auto 0;border-radius:50%;background:var(--soft);font-style:normal;font-weight:700;color:var(--faint);font-size:13px;}
.week i.done{background:var(--blue);color:#fff;}
.week i.today{box-shadow:0 0 0 2px var(--blue) inset;}
.week i.done.today{box-shadow:none;}

.plan{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px;}
.plan:first-child{border-top:none;}
.plan b{width:22px;flex:0 0 auto;color:var(--sub);}
.plan.now b,.plan.now span{color:var(--blue);font-weight:700;}

.check{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:none;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;padding:0;}
.check.on{background:var(--blue);border-color:var(--blue);}
.done-t{text-decoration:line-through;color:var(--faint)!important;}
.stars{color:var(--amber);letter-spacing:1px;font-size:13px;}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal!important;}

/* calculator */
.calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:var(--sub);}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;}
.field textarea{min-height:90px;resize:vertical;line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);}
.out{margin-top:14px;background:var(--soft);border-radius:16px;padding:14px 16px;}
.out-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13.5px;gap:10px;}
.out-row b{font-family:var(--display);font-weight:400;font-size:16px;text-align:right;}
.out-hero{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;margin-bottom:6px;border-bottom:1px solid var(--line);}
.pick{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;}
.pick button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--sub);}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);display:flex;justify-content:center;z-index:50;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 14px rgba(20,30,60,.06);}
.nav-in{display:flex;gap:2px;width:100%;max-width:480px;}
.nav button{flex:1;min-width:0;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;font-size:10.5px;font-weight:700;color:var(--sub);border-radius:16px;}
.nav button svg{width:22px;height:22px;}
.nav button.on{background:var(--soft);color:var(--blue);}

/* sheet */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:100;display:none;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.sheet{background:var(--card);width:100%;max-width:480px;max-height:92%;overflow-y:auto;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none;}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0 0 16px;}
.sheet .field{margin-bottom:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chips button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;color:var(--sub);}
.chips button.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue);}
.sheet-btns{display:flex;gap:8px;margin-top:18px;}
.sheet-btns button{flex:1;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;}
.btn-main{background:var(--blue);color:#fff;}
.btn-sub{background:var(--soft);color:var(--sub);}
.btn-del{background:rgba(240,68,82,.1);color:var(--up);flex:0 0 auto!important;padding:14px 18px!important;}
.sheet-extra{display:flex;gap:8px;margin-top:8px;}
.sheet-extra button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-weight:700;font-size:13.5px;color:var(--text);}
.info{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:12.5px;color:var(--sub);margin-bottom:12px;line-height:1.6;}
.inline{display:flex;gap:8px;}
.inline > *{flex:1;}

.chip.amber{background:rgba(255,159,28,.16);color:#C46A00;}
.tgl{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;color:var(--sub);flex:0 0 auto;}
.tgl.on{border-color:var(--up);background:rgba(240,68,82,.1);color:var(--up);}
.bgrow{padding:7px 0;}
.pick button.on{border-color:var(--blue);background:var(--blue-50);color:var(--blue);}
.skwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.skcol{background:var(--soft);border-radius:14px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;}
.skstep{display:flex;align-items:center;gap:8px;border:none;background:var(--card);border-radius:10px;padding:8px;font-size:13px;font-weight:500;text-align:left;}
.skstep .check{width:20px;height:20px;border-radius:6px;font-size:12px;}
.skstep.on{color:var(--faint);text-decoration:line-through;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;}
.pthumb{position:relative;border:none;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--soft);}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pthumb span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;}
.cmp-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.cmp-pick select{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-size:14px;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cmp figure{margin:0;}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;background:var(--soft);display:block;}
.cmp figcaption{font-size:12px;color:var(--sub);text-align:center;margin-top:4px;}
.rf{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.rf div{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px;white-space:pre-wrap;}
.rf b{display:block;font-size:12px;color:var(--sub);margin-bottom:2px;}
.tblwrap{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch;}
.cmpt{border-collapse:separate;border-spacing:0;font-size:13px;min-width:100%;}
.cmpt th,.cmpt td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);}
.cmpt tbody th{text-align:left;color:var(--sub);font-weight:700;position:sticky;left:0;background:var(--card);z-index:1;}
.cmpt thead th{font-size:12px;position:sticky;top:0;background:var(--card);}
.cmpt thead th:first-child{position:sticky;left:0;z-index:2;}
.cmpt thead button{border:none;background:none;font-weight:700;font-size:12px;color:var(--text);padding:0;max-width:84px;overflow:hidden;text-overflow:ellipsis;}
.cmpt th.self,.cmpt td:nth-child(2){background:var(--blue-50);}
.cmpt td{font-family:var(--display);font-size:15px;}
.cmpt .sc0{color:var(--faint);}
.cmpt .sc1,.cmpt .sc2{color:var(--faint);}
.cmpt .better{color:var(--up);font-weight:700;}
.cmpt tr.avg td{font-weight:700;}
.cmpt tr.meta td{font-family:var(--body);font-size:12px;color:var(--sub);}
.maplink{font-size:12px;font-weight:700;color:var(--blue);text-decoration:none;flex:0 0 auto;padding:6px 2px;}
.motto{margin-top:14px;padding:16px 18px 14px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);border-left:4px solid var(--blue);}
.motto q{display:block;font-family:var(--display);font-size:19px;line-height:1.4;quotes:none;word-break:keep-all;}
.motto cite{display:block;margin-top:6px;font-style:normal;font-size:12.5px;color:var(--sub);}
.slot-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 0 2px;}
.slot-h:first-of-type{margin-top:4px;}
.slot-h.now{color:var(--blue);}
.wkrow{display:grid;grid-template-columns:118px 1fr 88px;align-items:center;gap:8px;padding:7px 0;}
.wkl b{display:block;font-size:12.5px;}.wkl span{font-size:11.5px;color:var(--faint);}
.wkv{text-align:right;font-family:var(--display);font-size:15px;}.wkv span{display:block;font-family:var(--body);font-size:11px;color:var(--faint);}
.vthumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;}
.vthumb{border:none;padding:0;width:64px;height:64px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:var(--soft);}
.vthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.vlinks{display:flex;flex-direction:column;align-items:flex-end;gap:0;flex:0 0 auto;align-self:flex-start;}
.vlinks button{border:none;background:none;font-size:12px;font-weight:700;color:var(--blue);padding:6px 2px;}
.rp-row{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
.rp-row:first-of-type{border-top:none;}
.rp-row span:first-child{flex:1;color:var(--sub);}
.rp-row b{font-family:var(--display);font-weight:400;font-size:16px;}
.dl{font-size:11.5px;font-weight:700;color:var(--faint);min-width:74px;text-align:right;}
.dl.good{color:var(--green);}.dl.bad{color:var(--up);}
.row.has-subs{border-bottom:none;padding-bottom:6px;}
.subs{display:flex;flex-direction:column;gap:4px;margin:0 0 10px 36px;padding:8px;background:var(--soft);border-radius:12px;}
.sub{display:flex;align-items:center;gap:8px;border:none;background:var(--card);border-radius:9px;padding:7px 8px;font-size:13px;text-align:left;}
.sub .check{width:20px;height:20px;border-radius:6px;font-size:12px;}
.sub .sn{font-size:11px;font-weight:700;color:var(--faint);width:12px;}
.sub.on{color:var(--faint);text-decoration:line-through;}
.cdot{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:6px;vertical-align:1px;}
.btn-paste{flex:1;border:none;background:var(--blue);color:#fff;font-weight:700;font-size:14px;padding:12px;border-radius:12px;}
.lrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);}
.lrow:first-child{border-top:none;}
.lmain{flex:1;min-width:0;display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;}
.ltxt{display:flex;flex-direction:column;min-width:0;}
.ltxt .t{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ltxt .s{font-size:12px;color:var(--faint);margin-top:1px;}
.lthumb{position:relative;width:88px;height:50px;border-radius:8px;overflow:hidden;flex:0 0 auto;background:var(--soft);display:flex;align-items:center;justify-content:center;}
.lthumb img{width:100%;height:100%;object-fit:cover;display:block;}
.lthumb b{position:absolute;right:4px;bottom:4px;color:#fff;font-size:10px;padding:1px 5px;border-radius:4px;}
.lthumb.ph{color:#fff;font-weight:700;font-size:13px;}
.lbtns{display:flex;flex-direction:column;align-items:center;gap:4px;flex:0 0 auto;}
.ledit{border:none;background:none;color:var(--faint);font-size:18px;line-height:1;padding:2px 6px;}
.hlink{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit;}
.hlink:first-of-type{border-top:none;}
.hlink .t{font-weight:700;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.hlink .lthumb{width:64px;height:36px;}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const today=()=>ymd(new Date());
const thisMonth=()=>today().slice(0,7);
const dayDiff=(a,b)=>Math.round((parse(b)-parse(a))/86400000);
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d);};
const addMonths=(s,n)=>{const d=parse(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d);};
const DOW=['일','월','화','수','목','금','토'];
const md=s=>{const d=parse(s);return (d.getMonth()+1)+'/'+d.getDate();};
const mdLong=s=>{const d=parse(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DOW[d.getDay()]+')';};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';
const signWon=n=>(n>0?'+':n<0?'-':'')+Math.abs(Math.round(n||0)).toLocaleString('ko-KR')+'원';
const pct=n=>(isFinite(n)?(n>0?'+':'')+n.toFixed(2):'0.00')+'%';
const pnlCls=n=>n>0?'up':n<0?'down':'';
function manwon(n){
  const neg=n<0; n=Math.abs(Math.round(n||0)); let s;
  if(n>=1e8){const e=Math.floor(n/1e8),m=Math.round((n%1e8)/1e4);s=e+'억'+(m?' '+m.toLocaleString('ko-KR')+'만':'')+'원';}
  else if(n>=1e4){s=Math.round(n/1e4).toLocaleString('ko-KR')+'만원';}
  else s=n.toLocaleString('ko-KR')+'원';
  return (neg?'-':'')+s;
}
const num=v=>{const n=parseFloat(String(v??'').replace(/,/g,''));return isFinite(n)?n:0;};
const fmtPrice=(n,cur)=>cur==='USD'?'$'+(+n||0).toLocaleString('en-US',{maximumFractionDigits:2}):won(n);
const PAL=['#3182F6','#00C7AE','#FFB331','#8B5CF6','#FF8A3D','#F04452','#4DB6FF','#2DBE60','#E86AA6','#8B95A1','#6D7CFF','#C4A35A'];
const colorOf=(list,key)=>PAL[Math.max(0,list.indexOf(key))%PAL.length];

/* ---------- constants ---------- */
const R_CATS=['몸관리','피부','얼굴형','피부과','시술·관리','건강','집안일','생활용품','기타'];
const OUT_CATS=['식비','카페·간식','교통','쇼핑','생활','주거','통신','구독','의료','경조사','사업','기타'];
const IN_CATS=['월급','알바','사업수익','부수입','용돈','기타'];
const A_TYPES=['입출금','예적금','현금','투자·연금','부동산·기타','부채'];
const F_CATS=['주거','통신','구독','보험','교통','대출','공과금','기타'];
const W_KINDS=['헬스','러닝','수영','홈트','등산','구기','기타'];
const B_CATS=['여행','경험','배움','물건','관계','기타'];
const I_CATS=['메뉴','마케팅','운영','신사업','기타'];

/* ---------- data ---------- */
const DEF={
  routines:{items:[
    {id:'r1',name:'피부 스크럽',cat:'몸관리',freq:'week',n:1,unit:'주',last:'',history:[]},
    {id:'r3',name:'손톱·발톱 깎기',cat:'몸관리',freq:'week',n:1,unit:'주',last:'',history:[]},
    {id:'r4',name:'손에 닿는 것들 소독하기',cat:'집안일',freq:'week',n:1,unit:'주',last:'',history:[]},
    {id:'r2',name:'머리 깎기',cat:'몸관리',freq:'month',n:1,unit:'개월',last:'',history:[]}
  ]},
  ledger:{items:[],budgets:{}},
  assets:{accounts:[],snaps:{}},
  fixed:{items:[]},
  stocks:{items:[],fx:1380},
  workout:{items:[],plan:['','','','','','','']},
  bucket:{items:[]},
  biz:{ideas:[],visits:[],self:{}},
  goals:{items:[]},
  body:{weights:[],sleep:[],photos:[],meals:[],target:'',skin:{am:['세안','토너','세럼','수분크림','선크림'],pm:['클렌징','세안','토너','세럼','수분크림'],log:{},products:[]}},
  reflect:{items:[]},
  books:{items:[]},
  work:{items:[]},
  links:{cats:['사업·장사','투자','운동','피부·외모','요리','자기계발','기타'],items:[]},
  ui:{pins:[]},
  shop:{cats:['생필품','식료품','화장품·뷰티','옷·잡화','전자기기','가게용품'],items:[]}
};
const REPLACE_DEF=[['칫솔 교체',3,'개월'],['면도날 교체',1,'개월'],['샤워기 필터 교체',2,'개월'],['수건 교체',12,'개월']];
const MODS=Object.keys(DEF);
const S={};
function loadLocal(k){try{const v=localStorage.getItem('life:'+k);return v?JSON.parse(v):null;}catch(e){return null;}}
function localAt(k){try{return +localStorage.getItem('life:at:'+k)||0;}catch(e){return 0;}}
function hydrate(k,o){const v=Object.assign(structuredClone(DEF[k]),o||{});if(k==='body')v.skin=Object.assign(structuredClone(DEF.body.skin),v.skin||{});return v;}
MODS.forEach(k=>{S[k]=hydrate(k,loadLocal(k));});

function migrate(){
  const R=S.routines;let ch=false;
  R.items.forEach(r=>{if(r.freq)return;ch=true;
    if(r.unit==='개월')r.freq='month';
    else if(r.unit==='일'&&+r.n===1)r.freq='day';
    else{r.freq='week';if(r.unit==='일'&&r.n%7===0){r.n=r.n/7;r.unit='주';}}});
  const V=R.v||0;
  if(V<2){ch=true;
    if(!R.items.some(r=>r.freq==='day'&&/물/.test(r.name)))R.items.unshift({id:uid(),name:'물 1L 마시기',cat:'건강',freq:'day',n:1,unit:'일',last:'',history:[]});}
  if(V<3){ch=true;
    if(!R.items.some(r=>/소독/.test(r.name)))R.items.push({id:uid(),name:'손에 닿는 것들 소독하기',cat:'집안일',freq:'week',n:1,unit:'주',last:'',history:[]});}
  if(V<4){ch=true;
    REPLACE_DEF.forEach(([n,c,u])=>{if(!R.items.some(r=>r.name===n))R.items.push({id:uid(),name:n,cat:'생활용품',freq:'replace',n:c,unit:u,last:'',history:[]});});}
  if(V<5){ch=true;
    [['이불 정리하기','집안일'],['좋아하는 노래 1곡 듣기','기타'],['양치하기','몸관리'],['주식 확인하기','기타'],['비타민 먹기','건강']].forEach(([n,c])=>{
      if(!R.items.some(r=>r.name===n))R.items.push({id:uid(),name:n,cat:c,freq:'day',n:1,unit:'일',last:'',history:[]});});}
  if(V<6){ch=true;
    R.items.forEach(r=>{if(r.freq==='day'&&!r.slot)r.slot=/이불|비타민|양치/.test(r.name)?'아침':'하루 중';});}
  if(V<7){ch=true;const add=o=>{if(!R.items.some(r=>r.name===o.name))R.items.push(Object.assign({id:uid(),last:'',history:[]},o));};
    add({name:'비타민C·올레즙 한 포 먹기',cat:'건강',freq:'day',n:1,unit:'일',slot:'아침'});
    add({name:'요가 스트레칭',cat:'몸관리',freq:'day',n:1,unit:'일',slot:'아침'});
    add({name:'뮤잉 운동',cat:'얼굴형',freq:'day',n:1,unit:'일',slot:'하루 중'});
    add({name:'얼굴 근막 마사지',cat:'얼굴형',freq:'day',n:1,unit:'일',slot:'하루 중',subs:['턱 밑 마사지','씹을 때 튀어나오는 턱근육 풀기','광대 밑·코 옆 마사지','눈썹 풀기','입 옆 풀기','입 안에 손가락 넣어 풀기']});
    add({name:'오다리 교정 운동',cat:'몸관리',freq:'day',n:1,unit:'일',slot:'수시로'});
    add({name:'비타민C 앰플 바르기',cat:'피부',freq:'week',n:2,unit:'일'});
    add({name:'레티날 크림 바르기',cat:'피부',freq:'week',n:2,unit:'일'});
    add({name:'눈썹 컨설팅',cat:'시술·관리',freq:'month',n:1,unit:'개월'});
    add({name:'피부과 물광주사',cat:'피부과',freq:'month',n:6,unit:'개월'});
    add({name:'아쿠아필',cat:'피부과',freq:'month',n:6,unit:'개월'});
    add({name:'스킨부스터 리투오',cat:'피부과',freq:'month',n:6,unit:'개월'});
    add({name:'레이저 제모',cat:'피부과',freq:'month',n:12,unit:'개월'});}
  if(ch)R.v=7;
  return ch;
}
const MIGRATED=migrate();
let DB=null;const timers={};
function setSync(mode){const el=$('#sync');if(mode==='ok'){el.textContent='동기화됨';el.className='sync ok';}else if(mode==='err'){el.textContent='저장 실패 · 기기에만 저장';el.className='sync';}else{el.textContent='이 폰에 저장 · 백업';el.className='sync';}}
function save(k){
  if(k==='assets'||k==='stocks'){snapNow();if(k==='stocks')persist('assets');}
  persist(k);
}
function persist(k){
  const at=Date.now();
  try{localStorage.setItem('life:'+k,JSON.stringify(S[k]));localStorage.setItem('life:at:'+k,at);}catch(e){}
  if(DB){clearTimeout(timers[k]);timers[k]=setTimeout(()=>{
    DB.collection('data/users/me').doc('life-'+k).set({json:JSON.stringify(S[k]),at}).then(()=>setSync('ok')).catch(()=>setSync('err'));
  },500);}
}
async function connect(){
  if(!window.claude||typeof claude.use!=='function')return;
  try{
    const db=await claude.use('db'); if(!db)return;
    await claude.use('user');
    const col=db.collection('data/users/me');
    const snap=await col.get();
    const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data();});
    DB=db;
    for(const k of MODS){
      const r=remote['life-'+k];
      if(r&&r.json&&(r.at||0)>=localAt(k)){
        try{S[k]=hydrate(k,JSON.parse(r.json));localStorage.setItem('life:'+k,r.json);localStorage.setItem('life:at:'+k,r.at||0);}catch(e){}
      }else if(localAt(k)){
        col.doc('life-'+k).set({json:JSON.stringify(S[k]),at:localAt(k)}).catch(()=>{});
      }
    }
    if(migrate())persist('routines');
    if(snapNow())persist('assets');
    setSync('ok');render();
  }catch(e){DB=null;setSync('local');}
}

/* ---------- derived ---------- */
function nextDue(r){if(!r.last)return today();return r.unit==='개월'?addMonths(r.last,r.n):addDays(r.last,r.unit==='주'?r.n*7:r.n);}
function remain(r){return dayDiff(today(),nextDue(r));}
function rProgress(r){if(!r.last)return 1;const span=dayDiff(r.last,nextDue(r))||1;return Math.min(1,Math.max(0,dayDiff(r.last,today())/span));}
function everyText(r){if(r.freq==='day')return '매일';if(+r.n===1&&r.unit==='주')return '매주';if(+r.n===1&&r.unit==='개월')return '매달';return r.n+(r.unit==='일'?'일':r.unit==='주'?'주':'개월')+'마다';}
const byFreq=f=>S.routines.items.filter(r=>(r.freq||'week')===f);
const doneToday=r=>(r.history||[]).includes(today());
function streak(r){const h=new Set(r.history||[]);let d=today();if(!h.has(d))d=addDays(d,-1);let n=0;while(h.has(d)){n++;d=addDays(d,-1);}return n;}
const FREQ_L={day:'하루',week:'주간',month:'월간',replace:'교체'};
const FREQ_K={하루:'day',주간:'week',한달:'month',월간:'month',교체:'replace'};
const isFresh=r=>!r.last&&(r.freq==='replace'||(r.freq==='month'&&+r.n>=3));
function stockKRW(s,key){return (+s[key]||0)*(+s.qty||0)*(s.cur==='USD'?(+S.stocks.fx||0):1);}
function stockTotals(){let v=0,c=0;S.stocks.items.forEach(s=>{v+=stockKRW(s,'price');c+=stockKRW(s,'avg');});return {value:v,cost:c,pnl:v-c,rate:c?(v-c)/c*100:0};}
function assetByType(){
  const m={};A_TYPES.forEach(t=>m[t]=0);
  S.assets.accounts.forEach(a=>{m[a.type]=(m[a.type]||0)+(+a.balance||0);});
  m['투자·연금']+=stockTotals().value;
  return m;
}
function netWorth(){const m=assetByType();let t=0;for(const k in m)t+=k==='부채'?-m[k]:m[k];return t;}
function snapNow(){const k=thisMonth(),v=netWorth();if(S.assets.snaps[k]===v)return false;S.assets.snaps[k]=v;return true;}
function monthSum(month){let i=0,o=0;S.ledger.items.forEach(e=>{if(e.date.startsWith(month)){if(e.type==='in')i+=+e.amount;else o+=+e.amount;}});return {in:i,out:o};}
function fixedTotal(){return S.fixed.items.reduce((a,b)=>a+(+b.amount||0),0);}
function nextFixedDate(f){const t=parse(today());let d=new Date(t.getFullYear(),t.getMonth(),1);const last=m=>new Date(m.getFullYear(),m.getMonth()+1,0).getDate();let cand=new Date(d.getFullYear(),d.getMonth(),Math.min(f.day,last(d)));if(cand<t){d.setMonth(d.getMonth()+1);cand=new Date(d.getFullYear(),d.getMonth(),Math.min(f.day,last(d)));}return ymd(cand);}
function weekDates(){const t=parse(today());const off=(t.getDay()+6)%7;const mon=new Date(t);mon.setDate(t.getDate()-off);return [...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return ymd(d);});}

/* ---------- ui state ---------- */
const U={tab:'home',lq:'',lCat:'',lDone:false,shopCat:'',shopDone:false,rt:'day',body:'workout',bk:'읽는 중',cmpKind:'',pa:'',pb:'',money:'ledger',rec:'reflect',biz:'ideas',calc:'ret',month:thisMonth(),bucketDone:false,
  c:{buy:'',sell:'',qty:'',fee:'0.25',target:'',q0:'',a0:'',p1:'',q1:'',goal:'',cur:'KRW'}};

/* ---------- charts ---------- */
function donut(parts,size=120){
  const total=parts.reduce((a,b)=>a+b.v,0);const r=46,c=2*Math.PI*r;let off=0;
  if(!total)return `<svg width="${size}" height="${size}" viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--soft)" stroke-width="16"/></svg>`;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*c;const s=`<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.c}" stroke-width="16" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return s;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="비율 차트">${segs}</svg>`;
}
function lineChart(points,o={}){
  const label=o.label||(p=>+p.k.slice(5)+'월');
  if(points.length<2)return `<div class="muted" style="padding:10px 0">${o.emptyMsg||'매달 자동으로 기록돼요. 다음 달부터 순자산 변화가 그래프로 보여요.'}</div>`;
  const W=320,H=120,P=14;const vals=points.map(p=>p.v).concat(o.target?[o.target]:[]);const min=Math.min(...vals),max=Math.max(...vals);const rng=max-min||1;
  const ty=o.target?H-22-(o.target-min)/rng*(H-40):null;
  const step=Math.ceil(points.length/7);
  const xy=points.map((p,i)=>[P+i*(W-2*P)/(points.length-1),H-22-(p.v-min)/rng*(H-40)]);
  const path=xy.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const area=path+` L${xy[xy.length-1][0]} ${H-22} L${xy[0][0]} ${H-22} Z`;
  const labels=points.map((p,i)=>(i%step===0||i===points.length-1)&&!(i!==points.length-1&&points.length-1-i<step)?`<text x="${xy[i][0]}" y="${H-5}" font-size="10" fill="var(--faint)" text-anchor="middle">${label(p)}</text>`:'').join('');
  const tl=ty!=null?`<line x1="0" x2="${W}" y1="${ty}" y2="${ty}" stroke="var(--green)" stroke-dasharray="4 4"/><text x="${W-2}" y="${ty-4}" font-size="9.5" fill="var(--green)" text-anchor="end">목표 ${o.target}</text>`:'';
  const vl=`<text x="${xy[xy.length-1][0]}" y="${xy[xy.length-1][1]-9}" font-size="10" font-weight="700" fill="var(--blue)" text-anchor="end">${o.fmt?o.fmt(points[points.length-1].v):''}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${o.aria||'순자산 추이'}">${tl}${vl}<path d="${area}" fill="var(--blue)" opacity=".1"/><path d="${path}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${xy.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3.5" fill="var(--card)" stroke="var(--blue)" stroke-width="2"/>`).join('')}${labels}</svg>`;
}
function bars(items){
  const max=Math.max(1,...items.map(i=>i.v));const W=320,H=110,bw=28,gap=(W-bw*items.length)/(items.length+1);

function cf(k,l){return `<div class="field"><label>${l}</label><input data-calc="${k}" inputmode="decimal" value="${esc(U.c[k])}" placeholder="0"></div>`;}
function f2(n){return U.c.cur==='USD'?'$'+n.toLocaleString('en-US',{maximumFractionDigits:2}):Math.round(n).toLocaleString('ko-KR')+'원';}
function calcOut(){
  const c=U.c;
  if(U.calc==='ret'){
    const b=num(c.buy),s=num(c.sell),q=num(c.qty)||1,fee=num(c.fee)/100;
    if(!b)return `<div class="muted">매수가와 매도가를 넣으면 수익이 계산돼요.</div>`;
    const cost=b*q,sale=s*q,fees=sale*fee,p=sale-cost-fees,rt=cost?p/cost*100:0;
    const t=num(c.target);const tp=t?b*(1+t/100)/(1-fee):0;
    return `<div class="out-hero"><span class="lbl">예상 수익률</span><span class="mid ${pnlCls(p)}">${pct(rt)}</span></div>
      <div class="out-row"><span>투자금</span><b>${f2(cost)}</b></div>
      <div class="out-row"><span>매도 금액</span><b>${f2(sale)}</b></div>
      <div class="out-row"><span>수수료·세금</span><b>${f2(fees)}</b></div>
      <div class="out-row"><span>실현 손익</span><b class="${pnlCls(p)}">${p>=0?'+':'-'}${f2(Math.abs(p))}</b></div>
      ${s?`<div class="out-row"><span>본전 매도가</span><b>${f2(b/(1-fee))}</b></div>`:''}
      ${t?`<div class="out-row"><span>목표 ${t}% 매도가</span><b>${f2(tp)}</b></div>`:''}`;
  }
  const q0=num(c.q0),a0=num(c.a0),p1=num(c.p1),q1=num(c.q1),g=num(c.goal);
  if(!q0||!a0)return `<div class="muted">지금 보유 수량과 평단을 넣고, 추가로 살 가격과 수량을 넣어보세요.</div>`;
  let h='';
  if(p1&&q1){
    const tq=q0+q1,tc=q0*a0+p1*q1,na=tc/tq,ch=(na-a0)/a0*100,rt=(p1-na)/na*100;
    h+=`<div class="out-hero"><span class="lbl">물타기 후 평단</span><span class="mid">${f2(na)}</span></div>
      <div class="out-row"><span>평단 변화</span><b>${f2(a0)} → ${f2(na)} (${pct(ch)})</b></div>
      <div class="out-row"><span>총 수량</span><b>${tq.toLocaleString('ko-KR')}주</b></div>
      <div class="out-row"><span>추가 투입금</span><b>${f2(p1*q1)}</b></div>
      <div class="out-row"><span>총 투자금</span><b>${f2(tc)}</b></div>
      <div class="out-row"><span>매수가 기준 수익률</span><b class="${pnlCls(rt)}">${pct((p1-a0)/a0*100)} → ${pct(rt)}</b></div>
      <div class="out-row"><span>본전까지 필요한 상승</span><b>${p1<na?pct((na-p1)/p1*100):'이미 수익권'}</b></div>`;
  }
  if(g){
    const price=p1||0;
    if(price&&g>price&&g<a0){const need=q0*(a0-g)/(g-price);h+=`<div class="out-row" style="${h?'border-top:1px solid var(--line);margin-top:6px;padding-top:10px':''}"><span>평단 ${f2(g)} 만들려면</span><b>${Math.ceil(need).toLocaleString('ko-KR')}주 · ${f2(Math.ceil(need)*price)}</b></div>`;}
    else h+=`<div class="muted" style="margin-top:6px">목표 평단은 추가 매수가보다 높고 현재 평단보다 낮아야 해요.</div>`;
  }
  return h||`<div class="muted">추가 매수가와 수량을 넣어보세요.</div>`;
}

/* ---- photo store (IndexedDB) ---- */
const PDB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{try{const r=indexedDB.open('jimin-life',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);}catch(e){rej(e);}});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('photos',mode);const req=fn(t.objectStore('photos'));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error);});},
  put(o){return this.tx('readwrite',s=>s.put(o));},
  get(id){return this.tx('readonly',s=>s.get(id));},
  del(id){return this.tx('readwrite',s=>s.delete(id));},
  all(){return this.tx('readonly',s=>s.getAll());}
};
const PHOTO={};
function hydratePhotos(){
  document.querySelectorAll('img[data-photo]').forEach(async img=>{
    const id=img.dataset.photo;
    if(PHOTO[id]){img.src=PHOTO[id];return;}
    try{const o=await PDB.get(id);if(o){PHOTO[id]=o.data;img.src=o.data;}else img.alt='사진 없음';}catch(e){img.alt='사진을 불러오지 못했어요';}
  });
}
function compressImage(file,max=900){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};img.src=url;});}

/* ---- generic helpers ---- */
function weekKey(d){const t=parse(d||today());t.setDate(t.getDate()-((t.getDay()+6)%7));return ymd(t);}
function weekRange(k){return [...Array(7)].map((_,i)=>addDays(k,i));}
function wkLabel(k){return md(k)+' ~ '+md(addDays(k,6));}
function sleepMin(s){if(!s.bed||!s.wake)return 0;const [bh,bm]=s.bed.split(':').map(Number),[wh,wm]=s.wake.split(':').map(Number);let m=(wh*60+wm)-(bh*60+bm);if(m<=0)m+=1440;return m;}
const hmS=m=>m?(m/60).toFixed(1)+'시간':'-';
const hm=m=>m?Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':''):'-';
function lastBy(arr,key='date'){return [...arr].sort((a,b)=>(b[key]||'').localeCompare(a[key]||'')||(b.ts||0)-(a.ts||0))[0];}
function budgetCats(){const b=S.ledger.budgets||{};return OUT_CATS.filter(c=>+b[c]>0);}
function catSpent(month){const m={};S.ledger.items.forEach(e=>{if(e.type==='out'&&e.date.startsWith(month))m[e.cat]=(m[e.cat]||0)+ +e.amount;});return m;}
function budgetState(month){const b=S.ledger.budgets||{};const sp=catSpent(month);const cats=budgetCats();let tb=0,ts=0;cats.forEach(c=>{tb+= +b[c];ts+=sp[c]||0;});return {cats,b,sp,tb,ts};}
const bColor=r=>r>=1?'var(--up)':r>=.8?'var(--amber)':'var(--blue)';
function goalSaved(g){return (g.deposits||[]).reduce((a,d)=>a+(+d.amount||0),0);}
function monthsLeft(due){if(!due)return 0;const t=parse(today()),d=parse(due);return Math.max(0,(d.getFullYear()-t.getFullYear())*12+d.getMonth()-t.getMonth()+(d.getDate()>=t.getDate()?0:-1)+1);}
function skinToday(){const sk=S.body.skin;const lg=(sk.log||{})[today()]||{am:[],pm:[]};
  const am=sk.am.filter(s=>(lg.am||[]).includes(s)).length,pm=sk.pm.filter(s=>(lg.pm||[]).includes(s)).length;return {am,pm,amN:sk.am.length,pmN:sk.pm.length};}
function skinFull(d){const sk=S.body.skin;const lg=(sk.log||{})[d];if(!lg)return false;return sk.am.every(s=>(lg.am||[]).includes(s))&&sk.pm.every(s=>(lg.pm||[]).includes(s));}
function skinStreak(){let d=today();if(!skinFull(d))d=addDays(d,-1);let n=0;while(skinFull(d)){n++;d=addDays(d,-1);}return n;}
function prodExpire(p){return p.opened?addMonths(p.opened,+p.months||12):'';}
function prevMonth(m){const d=parse(m+'-01');d.setMonth(d.getMonth()-1);return ymd(d).slice(0,7);}
function weekStats(k){
  const days=weekRange(k).filter(d=>d<=today());const set=new Set(days);
  let out=0,inc=0;S.ledger.items.forEach(e=>{if(set.has(e.date)){if(e.type==='in')inc+= +e.amount;else out+= +e.amount;}});
  const wdays=new Set(S.workout.items.filter(w=>set.has(w.date)).map(w=>w.date)).size;
  const daily=byFreq('day');let hit=0;daily.forEach(r=>(r.history||[]).forEach(h=>{if(set.has(h))hit++;}));
  const rate=daily.length&&days.length?Math.round(hit/(daily.length*days.length)*100):null;
  const sl=S.body.sleep.filter(s=>set.has(s.date));const slAvg=sl.length?Math.round(sl.reduce((a,s)=>a+sleepMin(s),0)/sl.length):0;
  const cAvg=sl.length?(sl.reduce((a,s)=>a+(+s.cond||0),0)/sl.length).toFixed(1):null;
  const ws=S.body.weights.filter(w=>set.has(w.date)&&+w.w).sort((a,b)=>a.date.localeCompare(b.date));
  const wch=ws.length>=2?+(ws[ws.length-1].w-ws[0].w).toFixed(1):null;
  const skin=days.filter(skinFull).length;
  return {out,inc,wdays,rate,slAvg,cAvg,wch,skin,days:days.length};
}

/* ---- 고정비 자동 기록 ---- */
function autoFixed(){
  let n=0,ch=false;const t=today();
  S.fixed.items.forEach(f=>{
    if(!f.autoSince){f.autoSince=t;ch=true;}
    if(f.auto===false)return;
    f.logged=f.logged||[];let m=f.autoSince.slice(0,7);
    while(m<=thisMonth()){
      const d=m+'-'+z(Math.min(+f.day||1,daysInMonth(m)));
      if(d>=f.autoSince&&d<=t&&!f.logged.includes(m)){
        S.ledger.items.push({id:uid(),ts:Date.now(),type:'out',amount:+f.amount||0,cat:FIX2OUT[f.cat]||'기타',memo:f.name,date:d,auto:f.id});
        f.logged.push(m);n++;ch=true;}
      m=nextMonth(m);}
    if(f.logged.length>24)f.logged=f.logged.slice(-24);
  });
  if(ch){persist('fixed');if(n)persist('ledger');}
  return n;
}

function shiftMin(w){if(!w.start||!w.end)return 0;const [a,b]=w.start.split(':').map(Number),[c,d]=w.end.split(':').map(Number);let m=(c*60+d)-(a*60+b);if(m<=0)m+=1440;return m;}
const lateShift=w=>w.end&&(w.end>='22:00'||w.end<w.start);
function sleepByWork(){
  const g={late:[],work:[],off:[]};
  S.body.sleep.forEach(s=>{const prev=addDays(s.date,-1);const ws=S.work.items.filter(w=>w.date===prev);
    (ws.some(lateShift)?g.late:ws.length?g.work:g.off).push(s);});
  const agg=a=>({n:a.length,sl:a.length?Math.round(a.reduce((x,s)=>x+sleepMin(s),0)/a.length):0,c:a.length?a.reduce((x,s)=>x+(+s.cond||0),0)/a.length:0});
  return {late:agg(g.late),work:agg(g.work),off:agg(g.off)};
}

function monthStats(m){
  const lastDay=m===thisMonth()?today():m+'-'+z(daysInMonth(m));
  const days=[];for(let d=m+'-01';d<=lastDay;d=addDays(d,1))days.push(d);const set=new Set(days);
  const ms=monthSum(m);const cs=catSpent(m);const top=Object.keys(cs).sort((a,b)=>cs[b]-cs[a]).slice(0,3).map(c=>({c,v:cs[c]}));
  const bs=budgetState(m);
  const saved=S.goals.items.reduce((a,g)=>a+(g.deposits||[]).filter(d=>(d.date||'').startsWith(m)).reduce((x,d)=>x+(+d.amount||0),0),0);
  const sn=S.assets.snaps;const nwCh=sn[m]!=null&&sn[prevMonth(m)]!=null?sn[m]-sn[prevMonth(m)]:null;
  const wdays=new Set(S.workout.items.filter(w=>set.has(w.date)).map(w=>w.date)).size;
  const daily=byFreq('day');let hit=0;daily.forEach(r=>(r.history||[]).forEach(h=>{if(set.has(h))hit++;}));
  const rate=daily.length&&days.length?Math.round(hit/(daily.length*days.length)*100):null;
  const sl=S.body.sleep.filter(s=>set.has(s.date));const slAvg=sl.length?Math.round(sl.reduce((a,s)=>a+sleepMin(s),0)/sl.length):0;
  const cAvg=sl.length?sl.reduce((a,s)=>a+(+s.cond||0),0)/sl.length:null;
  const ws=S.body.weights.filter(w=>set.has(w.date)&&+w.w).sort((a,b)=>a.date.localeCompare(b.date));
  const wLast=ws.length?+ws[ws.length-1].w:null;const wch=ws.length>=2?+(ws[ws.length-1].w-ws[0].w).toFixed(1):null;
  const skin=days.filter(skinFull).length;
  const meal3=days.filter(d=>MAIN_MEALS.every(x=>S.body.meals.some(m=>m.date===d&&m.slot===x&&!m.skip))).length;
  const visits=S.biz.visits.filter(v=>(v.date||'').startsWith(m)).length;
  const ideas=S.biz.ideas.filter(v=>(v.date||'').startsWith(m)).length;
  const books=S.books.items.filter(b=>b.status==='완료'&&(b.end||'').startsWith(m));

  const rep=S.routines.items.filter(r=>r.freq==='replace'&&(r.history||[]).some(h=>h.startsWith(m))).map(r=>r.name);
  return {m,meal3,days:days.length,in:ms.in,out:ms.out,left:ms.in-ms.out,top,bs,saved,nwCh,wdays,rate,slAvg,cAvg,wLast,wch,skin,visits,ideas,books,bucket,wkDays,wkMin,rep};
}

let formCfg=null;

function fieldHtml(v,f){
  const val=v[f.key]??f.def??'';
  let inp;
  if(f.type==='textarea')inp=`<textarea name="${f.key}" placeholder="${esc(f.ph||'')}">${esc(val)}</textarea>`;
  else if(f.type==='select')inp=`<select name="${f.key}">${f.options.map(o=>`<option ${o==val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='url')inp=`<input name="${f.key}" type="url" inputmode="url" autocapitalize="off" value="${esc(val)}" placeholder="${esc(f.ph||'')}">`;
  else if(f.type==='month')inp=`<input name="${f.key}" type="month" value="${esc(val)}">`;
  else if(f.type==='time')inp=`<input name="${f.key}" type="time" value="${esc(val)}">`;
  else if(f.type==='chips')inp=`<input type="hidden" name="${f.key}" value="${esc(val)}"><div class="chips" data-chips="${f.key}" ${f.optional?'data-opt="1"':''}>${f.options.map(o=>`<button type="button" class="${o==val?'on':''}" data-act="chip" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
  else if(f.type==='money')inp=`<input name="${f.key}" class="money" inputmode="numeric" value="${val!==''?Math.round(+val).toLocaleString('ko-KR'):''}" placeholder="${esc(f.ph||'0')}">`;
  else if(f.type==='num')inp=`<input name="${f.key}" inputmode="decimal" value="${esc(val)}" placeholder="${esc(f.ph||'0')}">`;
  else if(f.type==='date')inp=`<input name="${f.key}" type="date" value="${esc(val||(f.blank?'':today()))}">`;
  else inp=`<input name="${f.key}" value="${esc(val)}" placeholder="${esc(f.ph||'')}" maxlength="80">`;
  return `<div class="field"><label>${f.label}</label>${inp}</div>`;
}
function collect(){
  const o={};const flat=[];formCfg.fields.forEach(f=>f.type==='row'?flat.push(...f.items):flat.push(f));
  for(const f of flat){if(f.type==='info')continue;const el=$('#sheet [name="'+f.key+'"]');let v=el?el.value.trim():'';
    if(f.type==='money'||f.type==='num')v=v===''?'':num(v);
    if(f.req&&(v===''||v===0&&f.type==='money')){toast(f.label+'을(를) 입력해주세요');el&&el.focus();return null;}
    o[f.key]=v;}
  return o;
}

const NAVK=['tab','rt','body','money','rec','biz'];

function showSheet(){$('#ov').classList.add('show');
  if(!sheetPushed){sheetPushed=true;try{history.pushState({nav:navState(),sheet:1},'');}catch(e){}}}
function closeSheet(fromPop){$('#ov').classList.remove('show');formCfg=null;
  if(sheetPushed){sheetPushed=false;if(!fromPop){awaitPop=true;try{history.back();}catch(e){awaitPop=false;}}}}
function syncHistory(){if(restoring||awaitPop)return;const st=navState();const cur=history.state;
  try{if(!cur||!cur.nav)history.replaceState({nav:st},'');else if(!sameNav(cur.nav,st))history.pushState({nav:st},'');}catch(e){}}

function openBackup(){
  const n=S.ledger.items.length+S.routines.items.length+S.stocks.items.length+S.workout.items.length+S.body.weights.length+S.body.sleep.length+S.goals.items.length+S.books.items.length+S.reflect.items.length+S.biz.visits.length+S.work.items.length+S.shop.items.length+S.links.items.length;
  $('#sheet').innerHTML=`<h2>백업 · 복원</h2>
    <div class="info">기록은 이 폰의 브라우저 안에 저장돼요. 브라우저 데이터를 지우거나 폰을 바꾸면 사라지니, 가끔 백업 파일을 저장해두세요.<br>다른 폰이나 PC에서는 백업 파일을 불러오면 그대로 이어서 쓸 수 있어요.</div>
    <div class="sheet-extra" style="flex-direction:column">
      <button data-act="bk-export">백업 파일 저장 (${n}건${S.body.photos.length?` · 사진 ${S.body.photos.length}장`:''})</button>
      <button data-act="bk-import">백업 파일 불러오기</button>
    </div>
    <input type="file" id="bkFile" accept="application/json,.json" style="display:none">
    <div class="sheet-btns"><button class="btn-sub" data-act="f-close">닫기</button></div>`;
  formCfg={fields:[]};showSheet();
  $('#bkFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.app!=='jimin-life'||!d.data)throw 0;
      if(!confirm('지금 폰에 있는 기록을 백업 파일 내용으로 바꿀까요?'))return;
      MODS.forEach(k=>{if(d.data[k]){S[k]=hydrate(k,d.data[k]);persist(k);}});
      (d.photos||[]).forEach(p=>{PHOTO[p.id]=p.data;PDB.put(p).catch(()=>{});});
      migrate();closeSheet();render();toast('백업을 불러왔어요');}catch(err){toast('지민 라이프 백업 파일이 아니에요');}};
    rd.readAsText(f);});
}
async function exportBackup(){
  const data={};MODS.forEach(k=>data[k]=S[k]);
  let photos=[];try{photos=await PDB.all();}catch(e){}
  const blob=new Blob([JSON.stringify({app:'jimin-life',v:2,at:new Date().toISOString(),data,photos})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='지민라이프-백업-'+today()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('백업 파일을 저장했어요');
}

    case 'fx':openForm({title:'환율 수정',values:{fx:S.stocks.fx},fields:[{key:'fx',label:'1달러 = ?원',type:'num',req:1}],onSave:v=>{S.stocks.fx=v.fx;save('stocks');}});break;
    case 'w-add':F.workout();break; case 'w-edit':F.workout(id);break;
    case 'plan':openForm({title:'주간 운동 루틴',values:Object.fromEntries(S.workout.plan.map((p,i)=>['d'+i,p])),fields:[...'월화수목금토일'].map((d,i)=>({key:'d'+i,label:d+'요일',ph:i>4?'휴식':'예: 가슴·삼두 / 러닝 5km'})),noFocus:1,onSave:v=>{S.workout.plan=[0,1,2,3,4,5,6].map(i=>v['d'+i]||'');save('workout');}});break;
    case 'b-add':F.bucket();break; case 'b-edit':F.bucket(id);break;
    case 'b-filter':U.bucketDone=b.dataset.v==='true';render();break;
    case 'b-toggle':{const it=S.bucket.items.find(x=>x.id===id);if(!it)break;it.done=!it.done;it.doneAt=it.done?today():'';save('bucket');render();if(it.done)toast('축하해요! '+it.title+' 달성');break;}
    case 'i-add':F.idea();break; case 'i-edit':F.idea(id);break;
    case 'v-add':F.visit();break; case 'v-edit':F.visit(id);break;
    case 'chip':{const box=b.parentElement;const inp=$('#sheet [name="'+box.dataset.chips+'"]');
      if(box.dataset.opt&&b.classList.contains('on')){b.classList.remove('on');inp.value='';break;}
      box.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));inp.value=b.dataset.v;break;}
    case 'f-close':closeSheet();break;
    case 'f-save':{if(!formCfg)break;const v=collect();if(!v)break;const cfg=formCfg;if(cfg.validate){const msg=cfg.validate(v);if(msg){toast(msg);break;}}closeSheet();pendingToast=null;cfg.onSave(v);render();if(pendingToast)toast(pendingToast);else if(cfg.saveLabel!=='반영'&&!cfg.quiet)toast('저장했어요');pendingToast=null;break;}
    case 'f-del':{if(!formCfg||!confirm('삭제할까요?'))break;const cfg=formCfg;closeSheet();cfg.onDelete();render();toast('삭제했어요');break;}
    case 'f-extra':{const x=formCfg&&formCfg.extra[+b.dataset.i];if(x)x.fn();break;}
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList.contains('money')){const raw=t.value.replace(/[^\d]/g,'');t.value=raw?(+raw).toLocaleString('ko-KR'):'';}
  if(t.id==='lq'){U.lq=t.value;const el=$('#linkList');if(el)el.innerHTML=linkRows();}
  if(t.dataset.calc){U.c[t.dataset.calc]=t.value;$('#calcOut').innerHTML=calcOut();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&formCfg)closeSheet();});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.pick){U[t.dataset.pick]=t.value;render();}});
$('#photoIn').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  toast('사진을 저장하는 중…');
  try{const data=await compressImage(f);const id=uid();await PDB.put({id,data});PHOTO[id]=data;
    if(photoTarget&&photoTarget.type==='meal'){const m=S.body.meals.find(x=>x.id===photoTarget.id);if(m){(m.photos=m.photos||[]).push(id);save('body');}}
    else if(photoTarget&&photoTarget.type==='visit'){const v=S.biz.visits.find(x=>x.id===photoTarget.id);if(v){(v.photos=v.photos||[]).push(id);save('biz');}}
    else{S.body.photos.push({id,date:today(),memo:''});save('body');U.body='weight';}
    photoTarget=null;render();toast('사진을 저장했어요');}
  catch(err){toast('사진을 저장하지 못했어요');}});

if(MIGRATED)persist('routines');
const AUTO_N=autoFixed();
if(snapNow()&&localAt('assets'))persist('assets');render();connect();
if(AUTO_N)setTimeout(()=>toast(`고정비 ${AUTO_N}건을 가계부에 기록했어요`),400);
let lastDay=today();document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDay){lastDay=today();U.month=thisMonth();const n=autoFixed();render();if(n)toast(`고정비 ${n}건을 가계부에 기록했어요`);}});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
